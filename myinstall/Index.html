<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MyInstall · Admin Config Tool — Author → Review (Stitched Prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   HOST SHELL

   This file owns no UI of its own beyond one demo switcher. The two
   prototypes stay authoritative and unmodified in substance:

     question-creation-wizard_updated.html   Question Bank + Create wizard
     manager-review.html                     Review Queue + Review Canvas

   Both render the same Unify header and left nav from the same tokens, so
   swapping frames reads as ordinary navigation rather than a demo jump.
   Each frame keeps its own 1728×997 canvas and its own fit() scaling — the
   host deliberately does not scale anything, which is why the frames are
   left at full viewport size and switched with `visibility` (display:none
   would collapse their layout and make fit() compute a zero scale).

   Serve it (python3 -m http.server 8777) rather than double-clicking. The
   protocol below is postMessage-only — no contentDocument access — so file://
   has a chance of working, but localhost is the tested path.

   KNOWN LIMIT — a question authored in the wizard carries into the Review tab,
   the diff, the impact figures, the approver roster, the queue row and every
   outcome. It does NOT carry into the Deliberation tab on the AI-flagged
   branch: that thread (D. Wang's reject reason, D. Chen's QB-1042 comment, the
   87%-similar compare card) is hand-authored prose matched to the go-live
   scenario, and it is left stock rather than half-rewritten. Read it as
   "what a bank deliberation looks like", not as this question's discussion.
   ===================================================================== */
:root{
  --primary-500:#196FE1;
  --font:'Roboto',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#525659;font-family:var(--font);}

.frame{position:fixed;inset:0;width:100%;height:100%;border:0;
  visibility:hidden;pointer-events:none;}
.frame.on{visibility:visible;pointer-events:auto;}

/* Demo scaffold — same dark pill grammar as the in-prototype state switchers,
   and stacked above them bottom-centre for the same reason they live there:
   every other edge of a 1728×997 canvas carries real controls. 96px clears
   both switcher rows of the author-notification gallery, the review canvas's
   decision bar and its Approve button, and the bank's pagination. */
.surface-switch{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:300;
  display:flex;align-items:center;gap:2px;background:rgba(20,20,20,.92);
  border:1px solid rgba(255,255,255,.14);border-radius:9px;padding:4px 5px;
  box-shadow:0 6px 20px rgba(0,0,0,.35);}
.surface-switch .lbl{color:#8f8f8f;font-size:10px;font-weight:500;padding:0 8px 0 6px;
  text-transform:uppercase;letter-spacing:.6px;}
.surface-switch button{background:none;border:none;color:#d0d0d0;font-family:var(--font);
  font-size:11px;font-weight:500;padding:5px 11px;border-radius:6px;cursor:pointer;}
.surface-switch button:hover{color:#fff;}
.surface-switch button.on{background:var(--primary-500);color:#fff;}
.surface-switch .seat{color:#8f8f8f;font-size:10px;font-weight:500;padding:0 6px 0 10px;
  border-left:1px solid rgba(255,255,255,.14);margin-left:4px;letter-spacing:.4px;}
.surface-switch .seat b{color:#fff;font-weight:500;}
</style>
</head>
<body>

<iframe id="fWizard" class="frame on" title="Question Bank and Create Question wizard"></iframe>
<iframe id="fReview" class="frame"                  title="Review Queue and Manager Review canvas"></iframe>

<div class="surface-switch">
  <span class="lbl">Surface</span>
  <button data-surface="wizard" class="on">Question Bank</button>
  <button data-surface="review">Review Queue</button>
  <span class="seat" id="seat">Seat: <b>S. Gandhi</b> · author</span>
</div>

<script>
/* =====================================================================
   MESSAGE ROUTER

   Protocol (both directions, always `{mi:1,type,payload}`):

     frame → host   ready       {surface}      bridge is live
                    goto        {surface, open?}  cross to the other surface
                    submitted   {question payload} wizard submitted a question
                    role        {role}         which seat this surface is showing

     host → frame   submitted   forwarded to the review frame
                    open-wizard open the Create Question modal
                    open-authored  open the injected queue row
                    show        this surface is now visible

   postMessage is used rather than reaching into contentDocument so the whole
   thing also works over file:// where frames are cross-origin.
   ===================================================================== */
const FRAMES={
  wizard:{el:document.getElementById('fWizard'), ready:false, queue:[]},
  review:{el:document.getElementById('fReview'), ready:false, queue:[]},
};
const SEATS={
  author:  'Seat: <b>S. Gandhi</b> · author',
  reviewer:'Seat: <b>J. Park</b> · product owner (reviewer)',
};
let current='wizard';

function send(surface,type,payload){
  const f=FRAMES[surface]; if(!f) return;
  if(!f.ready){ f.queue.push([type,payload]); return; }   // bridge not up yet
  f.el.contentWindow.postMessage({mi:1,type,payload},'*');
}
function show(surface){
  if(!FRAMES[surface]) return;
  current=surface;
  Object.keys(FRAMES).forEach(k=>FRAMES[k].el.classList.toggle('on',k===surface));
  document.querySelectorAll('[data-surface]').forEach(b=>
    b.classList.toggle('on', b.dataset.surface===surface));
  seat(surface==='wizard' ? 'author' : 'reviewer');
  send(surface,'show',{});
}
function seat(role){
  document.getElementById('seat').innerHTML = SEATS[role] || SEATS.author;
}

document.querySelectorAll('[data-surface]').forEach(b=>
  b.onclick=()=>show(b.dataset.surface));

window.addEventListener('message',e=>{
  const m=e.data; if(!m||m.mi!==1) return;
  const from=m.from;

  if(m.type==='ready'){
    const f=FRAMES[from]; if(!f) return;
    f.ready=true;
    f.queue.splice(0).forEach(([t,p])=>send(from,t,p));
    return;
  }

  if(m.type==='goto'){
    const to=m.payload&&m.payload.surface;
    if(!FRAMES[to]) return;
    show(to);
    /* Deep links: cross AND land on the right screen in one click. */
    if(m.payload.open==='authored') send(to,'open-authored',{});
    if(m.payload.open==='wizard')   send(to,'open-wizard',{});
    return;
  }

  if(m.type==='submitted'){
    /* The queue row exists the moment the wizard's submit succeeds, whether or
       not the viewer crosses over — the reviewer's world moved on its own. */
    send('review','submitted',m.payload);
    return;
  }

  if(m.type==='role'){
    /* The review prototype's outcome screen is the AUTHOR's Question Bank, so
       the seat readout follows the frame's own reported role, not the surface. */
    if(from===current) seat(m.payload && m.payload.role);
    return;
  }
});
</script>

<html lang="en">
<head>
<meta charset="UTF-8" />

<style>
/* =====================================================================
   DESIGN TOKENS — pulled directly from the Figma handoff (Unify pallet)
   ===================================================================== */
:root{
  --white:#FFFFFF;
  --black:#000000;
  --grey-50:#F2F2F2;
  --surface:#F5F5F5;
  --grey-200:#DFDFDF;
  --grey-300:#BFBFBF;
  --grey-500:#808080;
  --grey-700:#606060;

  --primary-500:#196FE1;     /* brand blue */
  --primary-100:#DAE4F3;     /* info 100 / soft blue */

  --error:#EB0C00;
  --warning-500:#FA9C19;  --warning-100:#FEF0DC;
  --positive-500:#09AD00; --positive-100:#DAF2D9;
  --info-500:#074FAF;     --info-100:#DAE4F3;
  --default-500:#8A8D92;  --default-100:#EDEEEE;

  --font: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

/* Typography scale (Roboto) from tokens */
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font);
  font-size:14px; line-height:20px; font-weight:400;
  color:var(--black);
  background:#525659; /* canvas behind the app shell */
  overflow:hidden; /* app is scaled to fit; no page scrollbars */
}
button{font-family:var(--font);cursor:pointer;}
.h1{font-size:28px;line-height:40px;font-weight:400;}
.body1{font-size:14px;line-height:20px;font-weight:400;}
.body1-med{font-size:14px;line-height:20px;font-weight:500;}
.caption{font-size:12px;line-height:14px;font-weight:400;}
.caption-med{font-size:12px;line-height:14px;font-weight:500;}

/* =====================================================================
   APP SHELL : Unify header + left nav + page content (1728 x 997)
   ===================================================================== */
.app{
  width:1728px; height:997px; margin:0; position:relative;
  background:var(--white); display:flex; flex-direction:column;
  box-shadow:0 0 40px rgba(0,0,0,.4); overflow:hidden;
}

/* Global header (black) */
.unify-header{
  height:48px; background:var(--black); color:var(--white);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 20px; flex:none;
}
.unify-header .brand{font-weight:700;font-size:16px;letter-spacing:.5px;}
.unify-header .right{display:flex;align-items:center;gap:18px;}
.unify-header .ic{width:20px;height:20px;color:#fff;opacity:.9;position:relative;display:flex;}
.unify-header .badge{position:absolute;top:-6px;right:-6px;background:var(--error);color:#fff;
  font-size:10px;line-height:14px;border-radius:8px;min-width:15px;height:15px;text-align:center;padding:0 3px;font-weight:500;}
.unify-header .avatar{width:30px;height:30px;border-radius:50%;background:#fff;color:#222;
  font-size:12px;font-weight:500;display:flex;align-items:center;justify-content:center;}

.shell{flex:1;display:flex;min-height:0;}

/* Left navigation (256) */
.nav{width:256px;background:#0f0f0f;color:#fff;display:flex;flex-direction:column;flex:none;}
.nav-head{height:60px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid rgba(255,255,255,.12);}
.nav-head .logo{width:28px;height:20px;background:#000;border:1px solid #444;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:7px;color:#fff;font-weight:700;}
.nav-head .t{font-size:14px;font-weight:500;}
.nav-scroll{flex:1;overflow:auto;padding:8px 0;}
.nav-item{height:40px;display:flex;align-items:center;gap:12px;padding:0 16px;color:#e6e6e6;font-size:14px;cursor:pointer;border-radius:0;}
.nav-item:hover{background:rgba(255,255,255,.06);}
.nav-item.active{background:rgba(255,255,255,.14);color:#fff;font-weight:500;}
.nav-item .ni{width:18px;height:18px;flex:none;display:flex;color:#cfcfcf;}
.nav-item.active .ni{color:#fff;}
.nav-section{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px;color:#9a9a9a;font-size:12px;font-weight:500;letter-spacing:.3px;}
.nav-section svg{width:16px;height:16px;color:#9a9a9a;flex:none;}
.nav-foot .icons svg,.nav-foot .collapse svg{width:18px;height:18px;}
.nav-foot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.12);}
.nav-foot .icons{display:flex;gap:18px;color:#cfcfcf;margin-bottom:12px;}
.nav-foot .icons svg{width:18px;height:18px;}
.nav-foot .brand{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:13px;letter-spacing:.5px;}
.nav-foot .collapse{width:28px;height:28px;border:1px solid #444;border-radius:4px;display:flex;align-items:center;justify-content:center;background:transparent;color:#fff;}

/* Page content */
.page{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--white);}
.page-header{height:100px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex:none;}
.page-title{font-size:28px;line-height:40px;font-weight:400;}
.btn-primary{background:var(--primary-500);color:#fff;border:none;border-radius:8px;height:40px;padding:0 16px;
  font-size:14px;font-weight:500;letter-spacing:.25px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;width:auto;}
.btn-primary:hover{background:#155bbd;}
.btn-primary:disabled{background:var(--grey-200);color:var(--grey-500);cursor:not-allowed;}
/* Button icons — fixed small size (fix: oversized SVGs) */
.btn-primary svg,.btn-secondary svg,.btn-ghost svg,.link-btn svg{width:18px;height:18px;flex:none;}
.page-body{flex:1;min-height:0;overflow:auto;padding:0 24px;}

.tabs{display:flex;gap:28px;border-bottom:1px solid var(--grey-200);margin-bottom:0;}
.tab{padding:10px 2px 12px;font-size:14px;color:var(--grey-700);cursor:pointer;border-bottom:2px solid transparent;}
.tab.active{color:var(--black);font-weight:500;border-bottom-color:var(--black);}

.filters{display:flex;align-items:center;justify-content:space-between;padding:16px 0;}
.chips{display:flex;gap:8px;}
.chip-dd{height:32px;border:1px solid var(--grey-300);border-radius:16px;background:#fff;padding:0 12px;display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#333;}
.chip-dd svg{width:14px;height:14px;color:var(--grey-500);}
.search{position:relative;}
.search input{width:320px;height:36px;border:1px solid var(--grey-300);border-radius:18px;padding:0 14px 0 38px;font-size:14px;font-family:var(--font);outline:none;}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--grey-500);}

/* Table */
table.qb{width:100%;border-collapse:collapse;}
table.qb th{ text-align:left;font-size:12px;font-weight:500;color:var(--grey-700);padding:8px 12px;border-bottom:2px solid var(--black);}
table.qb td{padding:12px;font-size:14px;border-bottom:1px solid var(--grey-200);vertical-align:middle;}
table.qb tbody tr:nth-child(even){background:var(--surface);}
table.qb .col-cb{width:40px;}
.cbx{width:18px;height:18px;border:1.5px solid var(--grey-300);border-radius:4px;display:inline-block;background:#fff;}
.internal-id{color:var(--grey-700);}
.internal-id.pending{color:var(--grey-500);font-style:italic;}
.brick-chip{display:inline-flex;align-items:center;border:1px solid var(--grey-300);border-radius:14px;padding:4px 12px;font-size:13px;background:#fff;}
.status{display:inline-flex;align-items:center;border-radius:4px;padding:3px 10px;font-size:12px;font-weight:500;border:1px solid;background:#fff;}
.status.draft{color:var(--warning-500);border-color:var(--warning-500);}
.status.active{color:var(--positive-500);border-color:var(--positive-500);}
.status.review{color:var(--primary-500);border-color:var(--primary-500);}
.status.inactive{color:var(--grey-500);border-color:var(--grey-300);}
.pagination{display:flex;align-items:center;justify-content:flex-end;gap:18px;padding:16px 12px;color:var(--grey-700);font-size:13px;}
.pagination .pg-ic{display:flex;gap:10px;color:var(--grey-500);}
.pagination svg{width:16px;height:16px;}
.row-new{animation:flash 1.4s ease;}
@keyframes flash{0%{background:var(--primary-100);}100%{background:transparent;}}

/* =====================================================================
   MODAL : scrim + dialog (900 x 700)
   ===================================================================== */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50;}
.scrim.open{display:flex;}
.dialog{width:900px;height:700px;background:#fff;border-radius:10px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 12px 48px rgba(0,0,0,.3);}
.dlg-head{height:65px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid var(--grey-200);}
.dlg-head .title{font-size:22px;font-weight:700;}
.dlg-head .x{border:none;background:none;width:32px;height:32px;color:#222;display:flex;align-items:center;justify-content:center;border-radius:6px;}
.dlg-head .x:hover{background:var(--surface);}
.dlg-mid{flex:1;display:flex;min-height:0;}

/* Stepper */
.stepper{width:212px;flex:none;border-right:1px solid var(--grey-200);padding:20px 14px;overflow:auto;}
.step-row{display:flex;align-items:flex-start;gap:12px;position:relative;}
.step-row .num{width:28px;height:28px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;color:#fff;background:var(--grey-300);z-index:2;}
.step-row .num svg{width:16px;height:16px;}
.step-row.active .num{background:var(--primary-500);}
.step-row.done .num{background:var(--primary-500);color:#fff;}
.step-row .lbl{font-size:14px;color:var(--grey-700);padding-top:5px;}
.step-row.active .lbl{color:var(--black);font-weight:500;}
.step-row.done .lbl{color:var(--black);}
.step-row.active{background:var(--primary-100);border-radius:8px;}
.step-row.active{padding:0 8px;margin:0 -8px;}
.step-wrap{padding:6px 0;}
.step-row.clickable{cursor:pointer;border-radius:8px;padding:0 8px;margin:0 -8px;}
.step-row.clickable:hover{background:var(--grey-50);}
.step-row.clickable:hover .lbl{color:var(--black);}
/* connector centered under the 28px circle (14px center − 1px half-width = 13px; +8px stepper pad alignment handled by wrap) */
.connector{width:2px;height:18px;background:var(--grey-300);margin-left:13px;}
.connector.done{background:var(--primary-500);}

/* Content */
.dlg-content{flex:1;min-width:0;padding:24px 28px;overflow:auto;}
.val-eyebrow{font-size:12px;font-weight:600;letter-spacing:.5px;color:var(--grey-500);text-transform:uppercase;margin-bottom:4px;}
.step-title{font-size:18px;font-weight:700;margin:0 0 6px;}
.step-sub{font-size:14px;color:var(--grey-700);margin:0 0 22px;max-width:640px;}

/* Footer */
.dlg-foot{height:68px;flex:none;border-top:1px solid var(--grey-200);display:flex;align-items:center;justify-content:space-between;padding:0 24px;}
.link-btn{background:none;border:none;color:var(--primary-500);font-size:14px;font-weight:500;padding:6px;display:inline-flex;align-items:center;gap:4px;}
.foot-right{display:flex;align-items:center;gap:12px;margin-left:auto;}
.btn-secondary{background:var(--primary-100);color:var(--primary-500);border:none;border-radius:8px;height:40px;padding:0 16px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;width:auto;}
.btn-secondary:disabled{background:var(--surface);color:var(--grey-300);cursor:not-allowed;}
.btn-ghost{background:none;border:1px solid var(--grey-300);color:#333;border-radius:8px;height:40px;padding:0 16px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;}

/* Form fields (filled style w/ label inside box) */
.field{border:1px solid var(--grey-300);border-radius:8px;padding:10px 14px;background:#fff;display:flex;flex-direction:column;gap:2px;}
.field.locked{background:var(--grey-50);}
.field .flabel{font-size:12px;color:var(--grey-700);display:flex;align-items:center;gap:4px;}
.field .req{color:var(--error);}
.field input{border:none;outline:none;background:transparent;font-size:15px;font-family:var(--font);padding:2px 0;color:var(--black);width:100%;}
.field .lock{margin-left:auto;color:var(--grey-500);width:18px;height:18px;}
.field-row{display:flex;align-items:center;}
.helper{font-size:13px;color:var(--grey-500);margin:6px 2px 0;}
.field-block{margin-bottom:20px;}
/* Active (focus) state — Figma shows a blue border when a field is being edited */
.field:focus-within:not(.locked):not(.err){border-color:var(--primary-500);}

/* ---- Step 1 : Help text creation flow ---- */
.s1-toggles{margin-top:4px;}
.field textarea.htarea{border:none;outline:none;background:transparent;font-size:15px;font-family:var(--font);
  width:100%;color:var(--black);resize:vertical;min-height:66px;padding:2px 0;line-height:20px;}
.field textarea.htarea::placeholder{color:var(--grey-500);}
.char-count{font-size:12px;color:var(--grey-500);margin:6px 2px 0;}
.char-count.over{color:var(--error);}

/* Toggle */
.toggle-wrap{display:flex;align-items:center;gap:14px;margin-top:6px;}
.switch{width:40px;height:22px;border-radius:11px;background:var(--grey-300);position:relative;flex:none;transition:.15s;}
.switch.on{background:var(--primary-500);}
.switch .knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s;}
.switch.on .knob{left:20px;}
.toggle-text .t{font-size:14px;font-weight:700;}
.toggle-text .s{font-size:13px;color:var(--grey-500);}

/* Radio / checkbox — flex-centered so the selected dot/check sits dead center */
.radio,.checkbox{width:20px;height:20px;border:2px solid var(--grey-300);flex:none;background:#fff;display:inline-flex;align-items:center;justify-content:center;}
.radio{border-radius:50%;}
.checkbox{border-radius:4px;}
.radio.sel{border-color:var(--primary-500);}
.radio.sel::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--primary-500);}
.radio-wrap{display:inline-flex;}
.checkbox.sel{background:var(--primary-500);border-color:var(--primary-500);}
.checkbox svg{width:14px;height:14px;}

.opt-card{border:1px solid var(--grey-200);border-radius:10px;padding:18px;margin-bottom:16px;}
.opt-card h4{margin:0 0 14px;font-size:14px;font-weight:700;}
.opt{display:flex;gap:12px;align-items:flex-start;padding:8px 0;cursor:pointer;}
.opt .radio-wrap{margin-top:1px;display:flex;align-items:center;justify-content:center;}
.opt .ot{font-size:14px;font-weight:500;}
.opt .od{font-size:13px;color:var(--grey-500);margin-top:2px;}
.sub-opts{margin:6px 0 4px 32px;border-top:1px solid var(--grey-200);padding-top:10px;}
.date-reveal{margin:10px 0 4px 32px;}

/* Search box (brick/portal) */
.searchbox{position:relative;margin-bottom:16px;}
.searchbox input{width:100%;height:44px;border:1px solid var(--grey-300);border-radius:22px;padding:0 16px 0 44px;font-size:14px;font-family:var(--font);outline:none;}
.searchbox svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--grey-500);}

/* Brick search results dropdown */
.brick-results{position:absolute;left:0;right:0;top:52px;z-index:40;background:#fff;border:1px solid var(--grey-200);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);max-height:300px;overflow-y:auto;}
.br-sec{padding:10px 14px 4px;font-size:11px;font-weight:600;letter-spacing:.4px;color:var(--grey-500);text-transform:uppercase;}
.br-item{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;font-size:14px;}
.br-item:hover{background:var(--surface);}
.br-item .meta{margin-left:auto;color:var(--grey-500);font-size:12px;}
.br-empty{padding:14px;color:var(--grey-500);font-size:14px;}

/* Brick groups */
.brick-group{border:1px solid var(--grey-200);border-radius:10px;overflow:hidden;margin-bottom:16px;}
.brick-head{background:var(--surface);display:flex;align-items:center;gap:12px;padding:12px 16px;font-weight:700;cursor:pointer;}
.brick-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--grey-200);cursor:pointer;}
.brick-item .bname{flex:1;}
.owner{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--grey-200);border-radius:18px;padding:4px 12px 4px 4px;}
.av{width:26px;height:26px;border-radius:50%;background:var(--grey-700);color:#fff;font-size:11px;font-weight:500;display:flex;align-items:center;justify-content:center;flex:none;}
/* Co-owned bricks: primary owner chip + "+N" chip that discloses the rest */
.owner-more-wrap{position:relative;display:inline-flex;flex:none;}
.owner-more{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:34px;
  border:1px solid var(--grey-200);border-radius:18px;padding:0 10px;font-size:13px;color:var(--grey-700);
  background:#fff;cursor:pointer;user-select:none;}
.owner-more:hover{background:var(--grey-50);color:var(--black);}
.owner-more.open{background:var(--grey-50);border-color:var(--grey-300);color:var(--black);}
.owner-tip{position:absolute;right:0;bottom:calc(100% + 8px);z-index:20;background:#0f0f0f;color:#fff;
  border-radius:6px;padding:8px 12px;font-size:12px;line-height:17px;white-space:nowrap;
  display:flex;flex-direction:column;box-shadow:0 6px 20px rgba(0,0,0,.28);}

/* Internal ID card (Step 9 — Submitted for Review) */
.id-card{border:1px solid var(--grey-200);background:var(--grey-50);border-radius:10px;padding:16px 18px;margin-bottom:20px;}
.id-head{display:flex;align-items:center;justify-content:space-between;}
.id-lbl{font-size:12px;color:var(--grey-700);display:flex;align-items:center;gap:8px;}
.id-tag{border:1px solid var(--grey-300);border-radius:4px;padding:1px 6px;font-size:11px;color:var(--grey-700);background:#fff;}
.id-val{font-size:22px;font-weight:700;letter-spacing:.5px;margin-top:6px;}

/* Stat card (portal scope) */
.stat-card{background:var(--surface);border-radius:12px;padding:28px;text-align:center;margin-bottom:24px;}
.stat-card .big{font-size:56px;line-height:1;font-weight:400;}
.stat-card .lbl{font-size:14px;color:var(--grey-700);margin-top:10px;}
.stat-card .toggle-link{margin-top:14px;}
.toggle-link{color:var(--primary-500);font-weight:500;display:inline-flex;gap:6px;align-items:center;cursor:pointer;white-space:nowrap;width:fit-content;}
.toggle-link svg{width:16px;height:16px;flex:none;}
.portal-panel{background:#fff;border:1px solid var(--grey-200);border-radius:10px;margin-top:18px;padding:16px;text-align:left;}
.portal-row{display:flex;align-items:center;justify-content:space-between;padding:12px 4px;border-top:1px solid var(--grey-200);}
.portal-row:first-of-type{border-top:none;}
.portal-row .pn{font-weight:700;}
.portal-row .ps{font-size:13px;color:var(--grey-500);}
.portal-row-wrap{border-top:1px solid var(--grey-200);}
.portal-row-wrap:first-of-type{border-top:none;}
.portal-row-wrap .portal-row{border-top:none;}
.acc-toggle{cursor:pointer;display:inline-flex;align-items:center;gap:5px;margin-top:2px;}
.acc-toggle svg{width:14px;height:14px;color:var(--grey-500);}
.brick-acc{padding:2px 4px 12px;}
.brick-acc-row{display:flex;gap:24px;padding:5px 0;font-size:13px;}
.brick-acc-row .ws{color:var(--grey-500);min-width:64px;}
.brick-acc-row .bk{color:var(--black);min-width:172px;}
.brick-acc-row .cmf{color:var(--grey-500);}
.tag-inprogress{border:1px solid var(--primary-500);color:var(--primary-500);border-radius:4px;padding:3px 10px;font-size:12px;font-weight:500;}

/* Confirmation banner (no in-progress portals) — green check + dashed message */
.confirm-banner{display:flex;align-items:stretch;gap:14px;margin-bottom:24px;}
.confirm-banner .ck{width:40px;height:40px;border-radius:8px;background:var(--positive-500);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;}
.confirm-banner .ck svg{width:24px;height:24px;}
.confirm-banner .msg{flex:1;border:1.5px dashed var(--grey-300);border-radius:8px;padding:12px 16px;font-size:14px;line-height:20px;color:var(--black);display:flex;align-items:center;}

/* Publishing date picker (publishing schedule question) */
.pub-date{border-top:1px solid var(--grey-200);margin-top:8px;padding-top:16px;}
.pub-date .pd-label{font-size:14px;font-weight:700;color:var(--black);margin-bottom:10px;}
.pub-date .field{max-width:440px;}
.pub-date .field input[type=date]{border:none;outline:none;background:transparent;font-size:15px;font-family:var(--font);width:100%;color:var(--black);}

/* Impact summary big numbers */
.impact-stat{display:flex;align-items:baseline;gap:14px;margin:10px 0;}
.impact-stat .n{font-size:40px;line-height:1;font-weight:400;min-width:48px;text-align:right;}
.impact-stat .t{font-size:14px;color:var(--grey-700);}
.portal-tiles{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px;}
.portal-tile{border:1px solid var(--grey-200);border-radius:8px;padding:12px 16px;display:flex;align-items:center;gap:10px;font-size:14px;background:#fff;}
.portal-tile svg{width:22px;height:18px;color:var(--grey-500);}
.products-tagged{background:var(--surface);border-radius:10px;padding:16px;margin-top:18px;}
.pill{display:inline-flex;border:1px solid var(--grey-300);border-radius:16px;padding:5px 14px;font-size:13px;background:#fff;margin-right:8px;}

/* Alerts */
.alert{display:flex;border-radius:8px;overflow:hidden;border:1px solid;margin-bottom:18px;}
.alert .bar{width:48px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;}
.alert .body{padding:14px 16px;font-size:14px;flex:1;background:#fff;}
.alert.warning{border-color:var(--warning-500);}
.alert.warning .bar{background:var(--warning-500);}
.alert.info{border-color:var(--primary-500);}
.alert.info .bar{background:var(--primary-500);}
.alert.error{border-color:var(--error);}
.alert.error .bar{background:var(--error);}
.alert svg{width:22px;height:22px;}

/* ---- Exit paths: leave confirmation dialog (Figma: Screen=Wizard — leave confirmation) ---- */
.scrim2{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:60;}
.dialog.confirm{width:560px;height:auto;}
.dialog.confirm .dlg-body{padding:20px 28px;}
.dialog.confirm .dlg-body p{margin:0 0 14px;font-size:14px;line-height:20px;}
.dialog.confirm .dlg-body p:last-child{margin-bottom:0;color:var(--grey-700);}
.dialog.confirm .dlg-foot{height:64px;}
.dialog.confirm .foot-right{display:flex;align-items:center;gap:8px;}

/* ---- Exit paths: fixed toast (Figma: RDS Notifications, Type=Fixed, anchored bottom-right) ---- */
.toast-fixed{position:absolute;right:47px;bottom:47px;width:372px;z-index:120;display:flex;
  border-radius:8px;overflow:hidden;border:1px solid;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.18);}
.toast-fixed .bar{width:40px;flex:none;display:flex;align-items:flex-start;justify-content:center;padding-top:16px;color:#fff;}
.toast-fixed .bar svg{width:22px;height:22px;}
.toast-fixed .body{flex:1;padding:16px;background:#fff;}
.toast-fixed .t-title{font-size:14px;font-weight:500;line-height:20px;}
.toast-fixed .t-msg{font-size:14px;font-weight:400;line-height:20px;margin-top:2px;}
.toast-fixed .t-actions{display:flex;justify-content:flex-end;gap:16px;margin-top:10px;}
.toast-fixed .t-actions button{background:none;border:none;color:var(--primary-500);font-size:14px;font-weight:500;
  font-family:var(--font);padding:4px;cursor:pointer;}
.toast-fixed.positive{border-color:var(--positive-500);}
.toast-fixed.positive .bar{background:var(--positive-500);}
.toast-fixed.negative{border-color:var(--error);}
.toast-fixed.negative .bar{background:var(--error);}

/* Scanning */
.scan-banner{background:var(--info-100);border-radius:8px;padding:16px 18px;display:flex;gap:14px;align-items:flex-start;margin-bottom:22px;}
.spinner{width:24px;height:24px;border:3px solid var(--primary-500);border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;flex:none;margin-top:2px;}
@keyframes spin{to{transform:rotate(360deg);}}
.scan-banner .sc{font-size:12px;font-weight:500;letter-spacing:.5px;color:var(--primary-500);}
.scan-banner .sq{font-weight:700;font-size:15px;margin:2px 0;}
.scan-banner .sd{font-size:13px;color:var(--grey-700);}
.skeleton{border:1px solid var(--grey-200);border-radius:10px;padding:18px;margin-bottom:14px;}
.sk{height:12px;border-radius:6px;background:var(--grey-50);margin:8px 0;}
.sk.w1{width:30%;} .sk.w2{width:55%;} .sk.w3{width:45%;}

/* Match cards */
.match-card{border:1px solid var(--grey-200);border-radius:10px;padding:16px;margin-bottom:14px;}
.match-card.open{border-color:var(--primary-500);}
.match-top{display:flex;align-items:flex-start;gap:10px;cursor:pointer;}
.badge-sim{border:1px solid;border-radius:4px;padding:2px 8px;font-size:12px;font-weight:700;}
.badge-sim.high{color:var(--error);border-color:var(--error);}
.badge-sim.med{color:var(--warning-500);border-color:var(--warning-500);}
.badge-st{border:1px solid;border-radius:4px;padding:2px 8px;font-size:12px;font-weight:500;}
.badge-st.active{color:var(--positive-500);border-color:var(--positive-500);}
.badge-st.inactive{color:var(--grey-500);border-color:var(--grey-300);}
.match-q{font-weight:700;font-size:15px;margin:10px 0 2px;}
.match-meta{font-size:12px;letter-spacing:.4px;color:var(--grey-500);text-transform:uppercase;}
.match-right{margin-left:auto;text-align:right;color:var(--grey-500);font-size:13px;display:flex;gap:14px;align-items:center;}
.match-right svg{width:20px;height:20px;flex:none;color:var(--grey-500);}
.match-expand{margin-top:14px;border-top:1px solid var(--grey-200);padding-top:14px;display:flex;align-items:center;justify-content:space-between;gap:16px;}
.match-expand .ue{font-weight:700;}
.match-expand .ued{font-size:13px;color:var(--grey-500);max-width:340px;}

/* Reactivation flow (inactive matches) */
.match-expand.react{display:block;}
.react-deact{font-size:14px;color:var(--grey-700);padding-bottom:12px;border-bottom:1px solid var(--grey-200);margin-bottom:12px;}
.react-why{border:1px solid var(--grey-200);background:var(--surface);border-radius:8px;padding:12px 14px;margin-bottom:16px;}
.react-why .rw-h{font-weight:700;font-size:13px;margin-bottom:4px;}
.react-why .rw-d{font-size:13px;color:var(--grey-700);}
.react-cta{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;}
.react-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:14px;}
.react-field{margin-bottom:14px;}
.react-field .field-row{justify-content:space-between;}
.react-field .spark{color:var(--primary-500);display:inline-flex;cursor:pointer;}
.react-field .spark:hover{color:var(--info-500);}
.react-field .spark svg{width:18px;height:18px;}
.react-select{border:none;outline:none;background:transparent;font-size:15px;font-family:var(--font);width:100%;color:var(--black);-webkit-appearance:none;appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='none' stroke='%23808080' stroke-width='2' viewBox='0 0 24 24'><path d='M6 9l6 6 6-6'/></svg>");
  background-repeat:no-repeat;background-position:right 0 center;padding-right:22px;}
.react-text{border:none;outline:none;resize:vertical;min-height:64px;width:100%;font-family:var(--font);font-size:15px;color:var(--black);padding:2px 0;}
.split-btn{position:relative;}
.section-h{display:flex;align-items:center;justify-content:space-between;margin:22px 0 12px;}
.section-h .t{font-weight:700;}
.section-h .r{color:var(--grey-500);font-size:13px;}

/* Validation checks */
.vcheck{display:flex;gap:12px;align-items:flex-start;padding:9px 0;}
.vcheck svg{width:20px;height:20px;flex:none;margin-top:1px;}
.vcheck.ok svg{color:var(--positive-500);}
.vcheck.warn svg{color:var(--warning-500);}
.vcheck .vt{font-weight:700;font-size:14px;}
.vcheck .vd{font-size:13px;color:var(--grey-700);margin-top:2px;}
.vcheck .vlink{color:var(--primary-500);font-weight:500;font-size:13px;display:inline-block;margin-top:4px;cursor:pointer;}
.redirect{color:var(--grey-500);font-size:14px;margin-top:26px;}

/* Result success (AI no match / submit success) */
.result-center{text-align:center;padding-top:6px;}
.result-icon{width:64px;height:64px;border-radius:50%;background:var(--positive-100);display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px;}
.result-icon svg{width:32px;height:32px;color:var(--positive-500);}
.result-h{font-size:26px;font-weight:700;margin:4px 0 8px;}
.result-sub{color:var(--grey-700);max-width:560px;margin:0 auto 20px;}
.stat-3{display:flex;gap:16px;justify-content:center;margin:20px 0;}
.stat-3 .box{border:1px solid var(--grey-200);border-radius:8px;padding:16px 22px;min-width:150px;}
.stat-3 .box b{font-size:18px;}
.stat-3 .box span{display:block;color:var(--grey-700);font-size:13px;margin-top:4px;}
.means{text-align:left;max-width:560px;margin:18px auto 0;}
.means .mh{color:var(--positive-500);font-weight:700;margin-bottom:8px;}
.means .mrow{display:flex;gap:10px;align-items:center;padding:5px 0;font-size:14px;}
.means .mrow svg{width:18px;height:18px;color:var(--positive-500);flex:none;}

/* Submitted-for-review detail blocks */
.kv{margin:14px 0;}
.kv .k{font-size:13px;color:var(--grey-700);}
.kv .v{font-weight:700;font-size:15px;margin-top:2px;}
.reviewers{background:var(--surface);border-radius:10px;padding:16px;margin-top:16px;}
.reviewers .rh{display:flex;justify-content:space-between;color:var(--grey-700);font-size:13px;margin-bottom:6px;}
.rev-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--grey-200);}
.rev-row .who{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--grey-200);border-radius:20px;padding:4px 14px 4px 4px;background:#fff;}
.rev-row .br{color:var(--grey-700);font-size:13px;}
/* The table is keyed by BRICK, so the right cell holds the primary reviewer chip
   plus the same "+N" disclosure used on Step 3 (see ownerMoreHtml). */
.rev-row .bk{font-size:14px;}
.rev-row .rev-owners{display:inline-flex;align-items:center;gap:8px;}
.notif{background:var(--info-100);border-radius:10px;padding:16px;margin-top:16px;}
.notif .nh{font-weight:700;margin-bottom:10px;}
.notif .nrow{display:flex;gap:26px;color:var(--grey-700);}
.notif .nrow span{display:inline-flex;align-items:center;gap:8px;font-size:14px;}
.notif svg{width:18px;height:18px;color:var(--grey-700);}

/* Roadmap placeholder */
.roadmap{border:2px dashed var(--grey-300);border-radius:12px;padding:48px 32px;text-align:center;background:var(--surface);margin-top:8px;}
.roadmap .ric{width:56px;height:56px;border-radius:50%;background:var(--primary-100);display:inline-flex;align-items:center;justify-content:center;margin-bottom:14px;}
.roadmap .ric svg{width:28px;height:28px;color:var(--primary-500);}
.roadmap h3{margin:0 0 8px;font-size:18px;}
.roadmap p{color:var(--grey-700);max-width:520px;margin:0 auto;}
.roadmap .tag{display:inline-block;margin-top:14px;background:var(--primary-100);color:var(--info-500);font-weight:500;font-size:12px;border-radius:14px;padding:5px 14px;}

/* ---------- STEP 2 : Answer Type ---------- */
.at-select{position:relative;margin-bottom:8px;}
.at-trigger{border:1px solid var(--grey-300);border-radius:8px;padding:10px 14px;background:#fff;cursor:pointer;display:flex;align-items:center;gap:10px;}
.at-trigger.open{border-color:var(--primary-500);}
.at-trigger-main{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0;}
.at-trigger .flabel{font-size:12px;color:var(--grey-700);}
.at-trigger .req{color:var(--error);}
.at-trigger .val{font-size:15px;padding:2px 0;color:var(--black);}
.at-trigger .val.ph{color:var(--grey-500);}
.at-chev{color:var(--grey-500);flex:none;display:flex;}
.at-chev svg{width:18px;height:18px;}
.at-list{border:1px solid var(--grey-200);border-radius:10px;background:#fff;margin-top:8px;overflow-y:auto;max-height:288px;box-shadow:0 4px 16px rgba(0,0,0,.06);}
.at-opt{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;cursor:pointer;font-size:15px;}
.at-opt:hover{background:var(--surface);}
.at-opt.first{background:var(--grey-50);}
.at-opt .cat{color:var(--grey-500);font-size:13px;}
.at-config{margin-top:20px;}
.pair{display:flex;gap:16px;margin-bottom:16px;align-items:flex-start;}
.pair>*{flex:1;}
/* Inline field validation (answer-type config) */
.field-col{display:flex;flex-direction:column;}
.field.err{border-color:var(--error);}
.field-err{color:var(--error);font-size:13px;line-height:18px;margin:6px 2px 0;display:flex;gap:6px;align-items:flex-start;}
.field-err svg{width:14px;height:14px;flex:none;margin-top:2px;color:var(--error);}
.at-info{background:var(--primary-100);border-radius:8px;padding:12px 16px;margin-bottom:16px;}
.at-info .ih{color:var(--primary-500);font-weight:500;font-size:14px;}
.at-info .id{color:var(--grey-700);font-size:13px;margin-top:2px;}
.fieldgroup{margin-bottom:16px;}
.fieldgroup>.flabel{font-size:12px;color:var(--grey-700);display:block;margin:0 0 8px 2px;}
.fieldgroup>.flabel .req{color:var(--error);}
.chiprow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.dchip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--grey-300);border-radius:16px;padding:6px 14px;font-size:13px;background:var(--surface);}
.dchip .rm{cursor:pointer;color:var(--grey-500);display:inline-flex;}
.dchip .rm svg{width:12px;height:12px;}
.add-chip{display:inline-flex;align-items:center;gap:4px;border:1px dashed var(--primary-500);border-radius:16px;padding:6px 14px;font-size:13px;color:var(--primary-500);background:#fff;cursor:pointer;font-weight:500;}
.chip-add-wrap{position:relative;display:inline-flex;}
.chip-menu{position:absolute;top:40px;left:0;z-index:40;background:#fff;border:1px solid var(--grey-200);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.15);max-height:236px;overflow-y:auto;min-width:248px;}
.chip-menu .cm-item{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;font-size:14px;}
.chip-menu .cm-item:hover{background:var(--surface);}
.chip-menu .cm-item .flag{font-size:18px;line-height:1;}
.chip-menu .cm-item .code{font-weight:500;}
.chip-menu .cm-item .name{color:var(--grey-500);margin-left:auto;font-size:13px;}
.chip-menu .cm-empty{padding:12px 14px;color:var(--grey-500);font-size:13px;}
.dchip input{border:none;outline:none;background:transparent;font-size:13px;font-family:var(--font);width:72px;color:var(--black);}
.radio-inline{display:flex;gap:26px;align-items:center;flex-wrap:wrap;}
.radio-inline .opt{padding:4px 0;}
/* Label-left / options-right radio, so it reads as a peer of the toggle rows
   it sits between rather than a differently-shaped block.
   The prototype dialog is 900px wide against the Figma canvas's 1200px, so the
   three options can wrap here where they sit on one line in Figma. `flex-start`
   keeps the label anchored to the FIRST option row when that happens — with
   `center` (inherited from .toggle-row) it drifted between the wrapped rows. */
.toggle-row.radio-row{align-items:flex-start;}
.toggle-row.radio-row .tl{flex:0 0 auto;padding-top:4px;}
/* Row-gap kept tight so a wrapped option doesn't read as a separate control —
   the 20px only applies BETWEEN options on the same line. */
.toggle-row.radio-row .radio-inline{flex:1 1 auto;justify-content:flex-end;gap:0 20px;}

/* ---- Optional / prefilled field markers ---- */

/* Exception routing — derived from the typed Question Label.

function flags(){
  const l = (data.label||'').toLowerCase();
  const words = (data.label||'').trim().split(/\s+/).filter(Boolean).length;
  return {
    aiMatches:   /\bbay\b|service bay/.test(l),       // -> Step 6 returns similar matches
    noPortals:   /pilot/.test(l),                     // -> Step 5 shows 0 matching portals
    longLabel:   words > 15,                          // -> Step 7 readability warning
    forceWarn:   /warning/.test(l),                   // -> Step 7 readability warning
    submitError: /error|fail/.test(l),                // -> Step 9 submission fails
    draftError:  /draft error|draft fail/.test(l),    // -> "Leave and save draft" fails
  };
}
function hasValidationWarnings(){
  const f = flags();

/* ---------------------------------------------------------------------------
   INTERNAL ID  (UX call 22 Jul — "Internal ID Improvements" + "Generate Internal
   ID Later in the Creation Flow")
   Stakeholders asked for a *meaningful* ID carrying applicability context, and
   for it to be generated after that context exists. So the ID is no longer
   assigned on Step 1 — it is minted on Step 9 (Submitted for Review), at the
   moment the submission actually succeeds, in the standardized structure:

       QA - <workstream> - <brick> - <4-digit sequence>       e.g. QA-FIXOPS-SVC-0142

   · QA        fixed prefix, marks this as a Question-Bank asset
   · workstream/brick  taken from the FIRST brick selected in Step 3 (the
                       question's primary applicability)
   · sequence  zero-padded, guarantees uniqueness within the segment
   A question with no brick context falls back to QA-GEN-0000-style.
   Nothing before Step 9 may display an ID — Impact Summary can only say one
   *will* be assigned, because a question abandoned there never gets one.
   --------------------------------------------------------------------------- */
/* Look a brick up by name, so screens downstream of Step 3 can reach its owner
   and co-owners without re-declaring the cast. */
function brickItem(name){
  for(const g of BRICK_GROUPS){
    const it = g.items.find(x=>x.b===name);
    if(it) return it;
  }
  return null;
}
function brickContext(){
  const first = data.bricks && data.bricks[0];
  if(!first) return null;
  for(const g of BRICK_GROUPS){
    const it = g.items.find(x=>x.b===first);
    if(it) return {ws:g.code, wsName:g.name, brick:it.code, brickName:it.b};
  }
  return null;
}
function genInternalId(){
  const ctx = brickContext();
  const seq = String(Math.floor(1+Math.random()*9998)).padStart(4,'0');
  return ctx ? `QA-${ctx.ws}-${ctx.brick}-${seq}` : `QA-GEN-${seq}`;
}

/* The confirmation is a delicate-action guard: it only fires when there is
   actually something to lose. A pristine wizard closes immediately. */
function isDirty(){
  return !!(data.label || data.internalId || data.allowCloning || data.helpTextOn || data.helpText || data.answerType ||
            (data.bricks && data.bricks.length) || data.portalScope || data.publishWhen ||
            (data.columns && data.columns.length));
}
function requestClose(){ isDirty() ? openLeaveConfirm() : closeModal(); }

function openLeaveConfirm(){
  if($('#scrim2')) return;
  const s = el(`<div class="scrim2" id="scrim2">

        <div class="dlg-head"><div class="title">Leave without saving?</div><button class="x" id="confirmX">${I.x}</button></div>
        <div class="dlg-body">
          <p>You have unsaved changes to this question. If you leave now, they'll be lost.</p>
          <p>You can save your work as a draft instead and finish it later — drafts aren't visible to dealers.</p>
        </div>
        <div class="dlg-foot">
          <button class="link-btn" id="keepEditing">Keep editing</button>
          <div class="foot-right">
            <button class="btn-secondary" id="leaveNoSave">Leave without saving</button>
            <button class="btn-primary" id="leaveSaveDraft">Leave and save draft</button>
          </div>
        </div>
      </div>
    </div>`);
  $('#app').appendChild(s);
  $('#keepEditing').onclick = closeLeaveConfirm;                                  // back to the wizard, nothing lost
  $('#confirmX').onclick    = closeLeaveConfirm;
  $('#leaveNoSave').onclick = ()=>{ closeLeaveConfirm(); closeModal(); };         // silent return — the dialog was the acknowledgement
  $('#leaveSaveDraft').onclick = ()=>{ closeLeaveConfirm(); saveDraftAndLeave(); };
}
function closeLeaveConfirm(){ const s=$('#scrim2'); if(s) s.remove(); }

/* Save-as-draft outcome. On failure the wizard STAYS OPEN so nothing the
   user entered is lost — the toast carries Dismiss / Try Again. */
function saveDraftAndLeave(){
  const name = data.label || 'This question';
  if(flags().draftError){
    showToast('negative', "Couldn't save draft — your work is safe",
      `"${name}" wasn't saved. Nothing you entered has been lost — try again, or keep editing.`,
      [{label:'Dismiss', onClick:hideToast},
       {label:'Try Again', onClick:()=>{ hideToast(); saveDraftAndLeave(); }}]);
    return;
  }
  if(data.label) addToBank('Draft','draft');   // never write a blank row to the bank
  closeModal();
  showToast('positive','Draft saved',
    `"${name}" is saved as a draft in your question bank. It isn't visible to dealers until you submit it for review.`);
}

let toastTimer=null;
function showToast(kind, title, msg, actions){

    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16h.01"/></svg>';
  const t = el(`<div class="toast-fixed ${kind}" id="toastFixed">

function hideToast(){ clearTimeout(toastTimer); const t=$('#toastFixed'); if(t) t.remove(); }

function renderStepper(){
  const sp=$('#stepper'); if(!sp) return;
  maxStep=Math.max(maxStep, step);          // remember the furthest point reached
  sp.innerHTML = STEPS.map((s,idx)=>{
    const n=idx+1; let cls='', circle=n;
    if(n===step){cls='active';}
    else if(n<=maxStep){cls='done';circle=I.vcheck;}   // stays done even after jumping back
    // any already-reached step (except the current one) is clickable — jumping keeps all progress
    const reachable = n<=maxStep && n!==step;
    const conn = idx<STEPS.length-1 ? `<div class="connector ${n<maxStep?'done':''}"></div>` : '';
    return `<div class="step-wrap"><div class="step-row ${cls} ${reachable?'clickable':''}" ${reachable?`data-gostep="${n}"`:''}><div class="num">${circle}</div><div class="lbl">${s}</div></div>${conn}</div>`;
  }).join('');
  sp.querySelectorAll('[data-gostep]').forEach(r=>{ r.onclick=()=>go(+r.dataset.gostep); });
}

function footer({left=true, primaryLabel, primaryDisabled=false, onPrimary, secondary=true, primaryIcon=true}={}){
  const f=$('#foot');
  f.innerHTML = `
    ${left?`<button class="link-btn" id="leaveDraft">Leave and Save Draft</button>`:'<span></span>'}
    <div class="foot-right">
      ${secondary?`<button class="btn-secondary" id="previewBtn" ${data.label?'':'disabled'}>Preview Question ${I.eye}</button>`:''}
      ${primaryLabel?`<button class="btn-primary" id="primaryBtn" ${primaryDisabled?'disabled':''}>${primaryLabel} ${primaryIcon?I.arrowR:''}</button>`:''}
    </div>`;
  if($('#leaveDraft')) $('#leaveDraft').onclick = saveDraftAndLeave;
  if($('#primaryBtn')&&onPrimary) $('#primaryBtn').onclick=onPrimary;
}

function go(n){ step=n; clearTimeout(redirectTimer); scanState='idle'; openMatchId=null; ddOpen=false; valFix=null; ownersOpen=null; renderStep(); }
function next(){ go(step+1); }

let _lastRenderedStep=null, _lastScanState=null, _lastValFix=null;
function renderStep(){
  renderStepper();
  clearTimeout(redirectTimer);
  const c=$('#content'); if(!c) return;
  ({1:stepContent,2:stepAnswerType,3:stepBrick,4:stepConditionalLogic,5:stepPortal,
    6:stepAI,7:stepValidation,8:stepImpact,9:stepSubmitted}[step])(c);

  if(step!==_lastRenderedStep || (step===6 && scanState!==_lastScanState) || (step===7 && valFix!==_lastValFix)){ c.scrollTop=0; }

/* Help text creation field, revealed when the Help text toggle is on.

function helpTextFieldHtml(){

/* Character-count line shown beneath the help-text field. Normal state reads
   "N/150 characters"; over the limit it turns red and appends the remove-N hint
   (matches Figma node 7936-154357). */
function helpCountText(len){
  const over=len>HELP_MAX;
  return `${len}/${HELP_MAX} characters${over?` — remove ${len-HELP_MAX} character${len-HELP_MAX===1?'':'s'} to continue.`:''}`;
}
/* Typing updates state + counter + error inline — never re-renders, so the

function bindHelpText(){
  const ht=$('#qHelp'); if(!ht) return;
  ht.oninput=()=>{
    data.helpText=ht.value;
    const len=ht.value.length, over=len>HELP_MAX;
    const cnt=$('#htCount'), fld=$('#htField');
    cnt.textContent=helpCountText(len);
    cnt.classList.toggle('over',over);

}
function updateStep1Footer(){

      switch(f.k){
        case 'pair':   return f.optional ? true : (v('f'+idx+'a')!=='' && v('f'+idx+'b')!=='');
        case 'pairdate': return f.optional ? true : (v('f'+idx+'a')!=='' && v('f'+idx+'b')!=='');
        case 'input':  return f.optional ? true : v('f'+idx)!=='';
        case 'chips':  return (col.cfg['c'+idx]||f.chips).length>0;
        default:       return true;
      }
    });
  });
}
function listErrors(){
  return data.columns.some(col=>{
    const t=ANSWER_TYPES.find(x=>x.id===col.type); if(!t) return false;
    const g=k=>col.cfg[k]||'';
    return t.fields.some((f,idx)=>{
      if(f.k==='pair'){
        if(fieldError(f.a.label,g('f'+idx+'a'))||fieldError(f.b.label,g('f'+idx+'b'))) return true;
        const a=parseFloat(g('f'+idx+'a')), b=parseFloat(g('f'+idx+'b'));
        return (!isNaN(a)&&!isNaN(b)&&b<a);
      }
      if(f.k==='input') return !!fieldError(f.label,g('f'+idx));
      return false;
    });
  });
}

/* Drag a column block by its handle to reorder — order drives the dealer's
   table columns and the CSV template header order. */
function bindColumnDrag(c){
  const clear=()=>c.querySelectorAll('.col-block').forEach(b=>b.classList.remove('drop-before','drop-after'));
  c.querySelectorAll('[data-colblock]').forEach(blk=>{
    const ci=+blk.dataset.colblock;
    const handle=blk.querySelector('[data-draghandle]');
    if(handle){
      handle.onmousedown=()=>{ blk.draggable=true; };
      handle.onmouseup=()=>{ blk.draggable=false; };
    }
    blk.ondragstart=e=>{
      dragCol=ci; blk.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';
      try{ e.dataTransfer.setData('text/plain',String(ci)); }catch(_){}
    };
    blk.ondragend=()=>{ blk.draggable=false; blk.classList.remove('dragging'); dragCol=null; clear(); };
    blk.ondragover=e=>{
      if(dragCol==null||dragCol===ci) return;
      e.preventDefault();
      const r=blk.getBoundingClientRect(); const after=(e.clientY-r.top)>r.height/2;
      blk.classList.toggle('drop-after',after);
      blk.classList.toggle('drop-before',!after);
    };
    blk.ondragleave=()=>blk.classList.remove('drop-before','drop-after');
    blk.ondrop=e=>{
      e.preventDefault();
      if(dragCol==null||dragCol===ci){ clear(); return; }
      const r=blk.getBoundingClientRect(); const after=(e.clientY-r.top)>r.height/2;
      const moved=data.columns.splice(dragCol,1)[0];
      let target=ci+(after?1:0);
      if(dragCol<target) target--;
      data.columns.splice(target,0,moved);
      dragCol=null; clear(); renderStep();
    };
  });
}

/* Which config fields expect a number, and of what shape. Drives inline
   validation so e.g. typing "hello" into "Maximum characters" errors. */
function numKind(label){
  const l=(label||'').toLowerCase();
  if(/file size/.test(l)) return 'filesize';
  if(/character|decimal place/.test(l)) return 'int';
  if(/value|amount|%|minimum|maximum/.test(l)) return 'number';
  return null;
}
function fieldError(label,val){
  const v=(val||'').trim(); if(!v) return null;          // empty handled by completeness gating
  const kind=numKind(label); if(!kind) return null;       // non-numeric field — no format rule
  if(kind==='filesize') return /^\d+(\.\d+)?\s*(mb|kb|gb)?$/i.test(v)?null:'Enter a size like “10 MB” — letters on their own aren’t valid.';
  if(kind==='int')      return /^\d+$/.test(v)?null:'Enter a whole number — letters and symbols aren’t allowed.';
  return /^-?\d+(\.\d+)?$/.test(v)?null:'Enter a number — letters and symbols aren’t allowed.';
}
function field(label,ph,key,optional){
  const val=data.atConfig[key]||'';
  let err=fieldError(label,val);
  // Max ≥ Min relationship check (pair fields end in 'a'/'b')
  if(!err && /maximum/i.test(label) && /b$/.test(key)){
    const a=parseFloat(data.atConfig[key.replace(/b$/,'a')]), b=parseFloat(val);
    if(!isNaN(a)&&!isNaN(b)&&b<a) err='Maximum must be greater than or equal to the minimum.';
  }
  const kind=numKind(label);
  // Optional fields carry no red asterisk and are labelled explicitly, so the
  // author can see the bound is skippable (currency min/max — 22 Jul decision).
  const mark = optional ? `<span class="opt-tag">optional</span>` : `<span class="req">*</span>`;
  return `<div class="field-col">
    <div class="field ${err?'err':''}"><div class="flabel">${label} ${mark}</div>
      <input placeholder="${ph||''}" data-cfg="${key}" ${kind?'inputmode="decimal"':''} value="${escAttr(val)}"></div>
    ${err?`<div class="field-err">${I.warn}<span>${escHtml(err)}</span></div>`:''}
  </div>`;
}
/* Live error refresh for a single edited input (avoids a full re-render so the
   field keeps focus); also re-checks its pair partner for the Max≥Min rule. */
function computeColError(col){
  const label=(col.querySelector('.flabel')?.textContent||'').replace('*','').trim();
  const inp=col.querySelector('input[data-cfg],input[data-ccfg]'); const val=inp?inp.value:'';
  let err=fieldError(label,val);
  if(!err && /maximum/i.test(label)){
    const pair=col.parentElement;
    if(pair&&pair.classList.contains('pair')){
      let minV=null;
      pair.querySelectorAll('.field-col').forEach(cc=>{ if(cc!==col){ const l=(cc.querySelector('.flabel')?.textContent||''); if(/minimum/i.test(l)) minV=cc.querySelector('input[data-cfg],input[data-ccfg]')?.value; }});
      const a=parseFloat(minV), b=parseFloat(val);
      if(minV!=null&&minV!==''&&val!==''&&!isNaN(a)&&!isNaN(b)&&b<a) err='Maximum must be greater than or equal to the minimum.';
    }
  }
  return err;
}
function applyColError(col){
  const err=computeColError(col);
  const fld=col.querySelector('.field'); let errEl=col.querySelector('.field-err');
  if(err){ fld.classList.add('err'); if(!errEl){ errEl=el(`<div class="field-err">${I.warn}<span></span></div>`); col.appendChild(errEl);} errEl.querySelector('span').textContent=err; }
  else { fld.classList.remove('err'); if(errEl) errEl.remove(); }
}
function refreshFieldError(inp){
  const col=inp.closest('.field-col'); if(!col) return;
  applyColError(col);
  const pair=col.parentElement;
  if(pair&&pair.classList.contains('pair')) pair.querySelectorAll('.field-col').forEach(cc=>{ if(cc!==col) applyColError(cc); });
}
/* Any answer-type config field currently holding an invalid value? */
function atConfigErrors(){
  const t=atType(); if(!t) return false;
  if(t.id==='list') return listErrors();
  const get=k=>data.atConfig[k]||'';
  return t.fields.some((f,idx)=>{
    if(f.k==='pair'){
      if(fieldError(f.a.label,get('f'+idx+'a'))||fieldError(f.b.label,get('f'+idx+'b'))) return true;
      const a=parseFloat(get('f'+idx+'a')), b=parseFloat(get('f'+idx+'b'));
      return (!isNaN(a)&&!isNaN(b)&&b<a);
    }
    if(f.k==='input') return !!fieldError(f.label,get('f'+idx));
    return false;
  });
}
function atFieldHtml(f,idx){

        <div class="switch ${on?'on':''}" data-tog="${idx}"><div class="knob"></div></div>

    }
  }

/* Dealer-facing rendering of a display style. Deliberately non-interactive —

function stylePreview(kind, style, idx){

    return `${q}<div class="sp-row"><span class="switch sp-sw"><span class="knob"></span></span><span class="sp-t">No</span></div>`;
  }
  if(style==='Dropdown'){
    return `${q}<div class="sp-dd"><span class="sp-ph">Select…</span>${I.chevDown}</div>`;
  }
  if(style==='Checkboxes'){
    return `${q}<div class="sp-stack">${opts.map(o=>`<div class="sp-row"><span class="sp-cb"></span><span class="sp-t">${escHtml(o)}</span></div>`).join('')}</div>`;

  return `${q}<div class="sp-stack">${opts.map(o=>`<div class="sp-row"><span class="radio-wrap"><span class="radio"></span></span><span class="sp-t">${escHtml(o)}</span></div>`).join('')}</div>`;
}

/* Dimension / operator / value catalogs (FR-QM3 / FR-QM4). Values depend on the
   chosen dimension; operators depend on the dimension type. */
const LOGIC_DIMS=['Product','Dealer Role','Geography','Manufacturer / OEM','Project Type','Contract Type','Prior answer'];
const LOGIC_OPS={'Prior answer':['is answered','is','is not'],_default:['is','is not','is one of','contains']};
const LOGIC_VALS={
  'Product':['Drive Service','Drive Accounting','Drive F&I Sales','Drive Parts','DMS','CRM','Appointment Scheduling'],
  'Dealer Role':['Service Manager','Controller','Fixed Ops Director','General Manager','IT Manager'],
  'Geography':['California','Texas','Florida','New York','Ontario'],
  'Manufacturer / OEM':['Ford','Toyota','GM','Honda','Stellantis'],
  'Project Type':['Unhook','Migration','Upgrade','New install'],
  'Contract Type':['FordDirect','Standard program','Enterprise'],
  'Prior answer':['How many service bays?','Has service department?','Website navigation ease','Preferred contact method'],
};
const logicOps=d=>LOGIC_OPS[d]||LOGIC_OPS._default;
const logicVals=d=>LOGIC_VALS[d]||[];
function newLogicRule(){return {conditions:[{dim:'',op:'',val:''}],vis:'',req:''};}
function condFilled(cd){return !!(cd.dim&&cd.op&&cd.val);}
function ruleComplete(r){return r.conditions.length&&r.conditions.every(condFilled)&&!!r.vis&&!!r.req;}
function completeRules(){return data.logicRules.filter(ruleComplete);}
/* Rule-set problem detection (mirrors the Figma "Conflict Detection" guardrail).
   Surfaces multiple problematic use cases as the admin builds. */
function ruleSig(r){return r.conditions.filter(condFilled).map(cd=>`${cd.dim}|${cd.op}|${cd.val}`).sort().join(' && ');}
function logicProblems(){
  const probs=[]; const cr=completeRules();
  // 1) Circular dependency — this question ends up depending on an answer that
  //    only exists when this question is shown (an unresolvable loop).
  if(data.logicRules.some(r=>r.conditions.some(cd=>cd.dim==='Prior answer'&&/how many service bays/i.test(cd.val))))
    probs.push({sev:'block',title:'Cycle detected — 1 issue blocks this logic',
      msg:'“How many service bays?” only shows when this question = Yes, but this rule makes this question depend on that answer — a circular reference that can never resolve. Remove or change this condition to continue.'});
  // 2) Contradictory rules — same conditions, opposite visibility (unpredictable).
  // 3) Duplicate rules — identical conditions + output (advisory).
  let contra=false,dup=false;
  for(let i=0;i<cr.length;i++) for(let j=i+1;j<cr.length;j++){
    const si=ruleSig(cr[i]); if(si && si===ruleSig(cr[j])){ (cr[i].vis!==cr[j].vis)?contra=true:dup=true; }
  }
  if(contra) probs.push({sev:'block',title:'Contradictory rules',
    msg:'Two rules use the same conditions but one shows and the other hides this question — the outcome is unpredictable. Reconcile them before continuing.'});
  if(dup) probs.push({sev:'advisory',title:'Duplicate rule',
    msg:'Two rules use identical conditions and the same output. Remove one to keep the logic clean.'});
  return probs;
}
function problemBanners(problems){
  return problems.map(p=>`<div class="alert ${p.sev==='block'?'warning':'info'}" style="margin-top:16px">
    <div class="bar">${p.sev==='block'?I.warn:I.info}</div>
    <div class="body"><b>${p.title}.</b> ${p.msg}</div></div>`).join('');
}

function stepConditionalLogic(c){
  if(!data.logicRules.length) data.logicRules=[newLogicRule()];
  const showToggle=completeRules().length>0;
  if(!showToggle) logicView='builder';

  const header=`<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px">

    </div>`;

/* Filter the workstream groups by the search query. A group is shown when its
   name matches (all its bricks shown) OR when it contains matching bricks (only
   those bricks shown). With no query, every group/brick is shown. */
function filteredBrickGroups(){
  const q=brickQuery.toLowerCase().trim();
  if(!q) return BRICK_GROUPS.map(g=>({name:g.name, items:g.items.slice()}));
  return BRICK_GROUPS.map(g=>{
    const nameMatch=g.name.toLowerCase().includes(q);
    const items = nameMatch ? g.items.slice() : g.items.filter(it=>it.b.toLowerCase().includes(q));
    return {name:g.name, items};
  }).filter(g=>g.items.length);
}
function renderBricks(){
  const list=$('#brickList'); if(!list) return;
  const groups=filteredBrickGroups();
  if(!groups.length){
    list.innerHTML=`<div class="brick-group"><div class="br-empty">No workstreams or bricks match "${escAttr(brickQuery.trim())}"</div></div>`;
    return;
  }
  list.innerHTML = groups.map(g=>{
    const allSel = g.items.every(it=>data.bricks.includes(it.b));
    return `<div class="brick-group">
      <div class="brick-head" data-group="${g.name}">
        <span class="checkbox ${allSel?'sel':''}">${allSel?cbCheck():''}</span>${g.name}
      </div>
      ${g.items.map(it=>`
        <div class="brick-item" data-brick="${it.b}">
          <span class="checkbox ${data.bricks.includes(it.b)?'sel':''}">${data.bricks.includes(it.b)?cbCheck():''}</span>
          <span class="bname">${it.b}</span>
          <span class="owner"><span class="av">${it.av}</span>${it.owner}</span>
          ${ownerMoreHtml(it)}

  }).join('');

  // informational disclosure and must not select the brick.
  list.querySelectorAll('[data-brick]').forEach(node=>node.onclick=(e)=>{
    if(e.target.closest('[data-owners]')) return;
    const b=node.dataset.brick;
    if(data.bricks.includes(b)) data.bricks=data.bricks.filter(x=>x!==b); else data.bricks.push(b);
    ownersOpen=null;
    renderBricks(); updateBrickFooter();
  });
  // "+N" chip → toggle the tooltip listing the additional owners.
  list.querySelectorAll('[data-owners]').forEach(node=>node.onclick=(e)=>{
    e.stopPropagation();
    const b=node.dataset.owners;
    ownersOpen = ownersOpen===b ? null : b;
    renderBricks(); updateBrickFooter();
  });
  // "Select all" on a header acts on the bricks currently visible in that group.
  list.querySelectorAll('[data-group]').forEach(node=>node.onclick=()=>{
    const g=groups.find(x=>x.name===node.dataset.group);
    const allSel=g.items.every(it=>data.bricks.includes(it.b));
    g.items.forEach(it=>{ if(allSel) data.bricks=data.bricks.filter(x=>x!==it.b); else if(!data.bricks.includes(it.b)) data.bricks.push(it.b); });
    renderBricks(); updateBrickFooter();
  });

function pickSubset(arr,n,seed){
  const a=arr.slice(); if(!a.length) return [];
  let s=0; for(const ch of seed) s=(s+ch.charCodeAt(0))%a.length;
  return a.slice(s).concat(a.slice(0,s)).slice(0,Math.min(n,a.length));
