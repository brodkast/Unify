function valWarnings(){
  const f=flags();
  const w=[];
  if((f.longLabel||f.forceWarn) && !data.readabilityAck) w.push('readability');
  if(data.ignoredMatch && !data.similarityReviewed) w.push('similarity');
  return w;
}
function stepValidation(c){
  if(valFix!==null){ renderValFix(c); return; }       // inside the guided fix sub-flow
  const warns = valWarnings();
  const readability = warns.includes('readability');
  const similarity = warns.includes('similarity');
  const checks = [
    {ok:true, t:'Schema valid'},
    {ok:true, t:'Governance metadata complete'},
    {ok:true, t:'Question label unique'},
    {ok:true, t:'Product applicability assigned — Internal ID can be generated on submission'},
  ];
  c.innerHTML = `
    <h2 class="step-title">Validation</h2>
    <p class="step-sub">Review validation results before submission</p>
    ${checks.map(vrow).join('')}
    ${ readability
        ? vrowWarn('Readability warning','Question label exceeds 15 words. Consider shortening for dealer clarity.','Fix in validation','fixReadability')
        : vrow({ok:true,t:'Good readability'}) }
    ${ similarity
        ? vrowWarn('Unresolved similarity match','An 87% similar question ("How many service bays does your dealership have?") was found and not reviewed. Confirm this is intentionally a new question.','Fix in validation','fixSimilarity')
        : vrow({ok:true,t:'No similar questions'}) }
    ${ warns.length ? '' : `<div class="redirect" id="redirectTxt">Redirecting you to Impact Summary in <b>10</b> seconds</div>` }`;
  // Warning links start the guided fix flow (they stay within Validation — never back to the create steps)
  if($('#fixReadability')) $('#fixReadability').onclick=()=>startValFix();
  if($('#fixSimilarity')) $('#fixSimilarity').onclick=()=>startValFix();
  if(warns.length){
    footer({primaryLabel:'Fix validation issues', onPrimary:startValFix});
  } else {
    footer({primaryLabel:'Continue to Impact Summary', onPrimary:next});
    startRedirect(()=>next());
  }
}
function startValFix(){ valFixList = valWarnings(); valFix = 0; renderStep(); }
function renderValFix(c){
  const warns = valFixList.length ? valFixList : valWarnings();
  if(!warns.length){ valFix=null; renderStep(); return; }
  const item = warns[Math.min(valFix,warns.length-1)];
  const n = warns.length, pos = valFix+1;
  const last = valFix >= n-1;
  const eyebrow = `<div class="val-eyebrow">VALIDATION ${pos}/${n}</div>`;
  if(item==='readability'){
    c.innerHTML = `${eyebrow}
      <h2 class="step-title">Question Content</h2>
      <p class="step-sub">Shorten the question label for better dealer readability. You're fixing this inside validation — your other steps stay as they are.</p>
      <div class="field-block">
        <div class="field"><div class="flabel">Question Label <span class="req">*</span></div>
          <input id="vfLabel" value="${escAttr(data.label)}" autocomplete="off"></div>
        <div class="helper">This is what dealers will see in their onboarding portal</div>
      </div>
      <div class="helper" style="margin-top:-8px">The Internal ID is generated from applicability when you submit — shortening the label here doesn't affect it.</div>`;
    const lab=$('#vfLabel');
    lab.oninput=()=>{ data.label=lab.value; };
  } else { // similarity
    const active=MATCHES.filter(m=>m.st==='active'), inactive=MATCHES.filter(m=>m.st==='inactive');
    c.innerHTML = `${eyebrow}
      <h2 class="step-title">AI Similarity Scan</h2>
      <p class="step-sub">Review the matches and confirm this is intentionally a new question. Finishing marks the similarity check as reviewed.</p>
      <div class="alert warning"><div class="bar">${I.warn}</div><div class="body"><b>5 similar questions found:</b> review matches before creating a new question to avoid duplicates.</div></div>
      <div class="section-h"><span class="t">Active — ${active.length} matches</span><span class="r">Recommended</span></div>
      ${active.map(reviewCard).join('')}
      <div class="section-h"><span class="t">Inactive — ${inactive.length} matches</span></div>
      ${inactive.map(reviewCard).join('')}`;
  }
  const cta = last ? 'Finish Validation' : `Continue to Validation ${pos+1}/${n}`;
  footer({primaryLabel:cta, onPrimary:()=>{
    if(item==='readability') data.readabilityAck=true;     // acknowledged / shortened
    if(item==='similarity')  data.similarityReviewed=true; // reviewed
    if(last){ valFix=null; }
    else { valFix++; }
    renderStep();
  }});
}
function reviewCard(m){
  return `<div class="match-card">
    <div class="match-top">
      <div style="flex:1">
        <div style="display:flex;gap:8px;align-items:center">
          <span class="badge-sim ${m.simCls}">${m.simTxt}</span>
          <span class="badge-st ${m.st}">${m.stTxt}</span>
        </div>
        <div class="match-q">${m.q}</div>
        <div class="match-meta">${m.meta}</div>
      </div>
      <div class="match-right">${m.right}</div>
    </div></div>`;
}
function vrow(v){ return `<div class="vcheck ${v.ok?'ok':''}">${I.vcheck}<div><div class="vt">${v.t}</div></div></div>`; }
function vrowWarn(t,d,linkTxt,linkId){ return `<div class="vcheck warn">${I.warn}<div><div class="vt">${t}</div><div class="vd">${d}</div><span class="vlink" id="${linkId}">${linkTxt}</span></div></div>`; }

/* ---------- STEP 8 : Impact Summary ---------- */
let impactExpanded=false;
function stepImpact(c){
  const f=flags();
  // No Internal ID on this step. It is minted on Step 9, once the submission
  // succeeds — a question abandoned here never receives one.
  const inProgress = f.noPortals ? 0 : 2;
  const tiles=['AutoNation Toyota Bellevue','Hendrick Honda Charlotte','Lithia Ford Lincoln Portland','Penske Toyota Cerritos','Larry H. Miller Chevrolet Murray'];
  const more=['Greenway Kia South','Sonic Audi Plano','Group 1 BMW Houston','Asbury Honda Tampa','Ken Garff Ford Provo','West Herr Chevy Buffalo','Napleton Acura Elmhurst','Berkshire Hathaway Auto','Morgan Subaru Austin'];
  c.innerHTML = `
    <h2 class="step-title">Impact Summary</h2>
    <p class="step-sub">Once published, this question will be added to the following portals and templates. Review before submitting.</p>
    <div class="impact-stat"><div class="n">14</div><div class="t">portals will receive this question</div></div>
    <div class="impact-stat"><div class="n">${inProgress}</div><div class="t">portals are currently in-progress (will apply per your Portal Scope selection)</div></div>
    <div class="impact-stat"><div class="n">3</div><div class="t">templates will include this question</div></div>
    <div class="impact-stat"><div class="n">0</div><div class="t">checklists affected</div></div>
    <div style="font-weight:700;margin:22px 0 10px">Sample portals that will include this question</div>
    <div class="portal-tiles">
      ${tiles.map(t=>`<div class="portal-tile">${I.car} ${t}</div>`).join('')}
      ${impactExpanded?more.map(t=>`<div class="portal-tile">${I.car} ${t}</div>`).join(''):''}
    </div>
    <div class="toggle-link" id="impMore" style="margin-top:14px">
      ${impactExpanded?`Hide 9 more ${I.chevUp}`:`View 9 more ${I.chevDown}`}</div>
    ${impactExpanded?`<div class="products-tagged"><div style="font-weight:700;margin-bottom:10px">Bricks Tagged</div>
      ${(data.bricks.length?data.bricks:['Drive DMS','Drive Service']).map(b=>`<span class="pill">${b}</span>`).join('')}</div>`:''}`;
  $('#impMore').onclick=()=>{impactExpanded=!impactExpanded;renderStep();};
  footer({primaryLabel:'Submit for Review', primaryIcon:true, onPrimary:()=>{ go(9); }});
}

/* ---------- STEP 9 : Submitted for Review (success OR error) ---------- */
let submitState='submitting';
function stepSubmitted(c){
  if(scanStateMarker()){ /* noop */ }
  // simulate submit
  submitState='submitting';
  c.innerHTML = `<div class="result-center" style="padding-top:80px"><div class="spinner" style="margin:0 auto 20px"></div>
    <div class="result-h" style="font-size:20px">Submitting for review…</div></div>`;
  footer({left:false, secondary:false, primaryLabel:null});
  setTimeout(()=>{ if(!modalOpen||step!==9) return; flags().submitError ? renderSubmitError(c) : renderSubmitSuccess(c); }, 1200);
}
function scanStateMarker(){return false;}
function renderSubmitSuccess(c){
  // Keyed by BRICK, not by reviewer, so "who reviews this brick" is answerable at
  // a glance — a brick can have more than one reviewer, and the extras collapse
  // into the same "+N" chip used on Step 3 (Figma 10536-282383).
  // Multi-reviewer bricks lead, because the dialog folds after ~3 rows.
  const bricks = (data.bricks.length?data.bricks:['Drive Service','Drive DMS','Appointment Scheduling'])
    .map(brickItem).filter(Boolean);
  const firstShared = bricks.findIndex(it=>(it.more||[]).length);
  if(firstShared>0) bricks.unshift(bricks.splice(firstShared,1)[0]);
  // The Internal ID is minted HERE — the submission has succeeded, so the ID
  // now refers to something that exists. It encodes the applicability captured
  // in Step 3, and is minted once: re-rendering this screen must not re-roll it.
  if(!data.internalId) data.internalId = genInternalId();
  c.innerHTML = `
    <div class="result-center" style="text-align:center">
      <div class="result-icon" style="background:var(--positive-100)">${I.seal}</div>
      <div class="result-h">Submitted for Review</div>
      <div class="result-sub">Your question has been successfully submitted and is awaiting approval</div>
    </div>
    <div class="alert info"><div class="bar">${I.info}</div><div class="body">This question is under manager review. You'll be notified when they finish reviewing.</div></div>
    <div class="id-card">
      <div class="id-head">
        <div class="id-lbl">Internal ID <span class="id-tag">System-assigned</span></div>
      </div>
      <div class="id-val">${escHtml(data.internalId)}</div>
    </div>
    <div class="kv"><div class="k">Question</div><div class="v">${data.label}</div></div>
    <div class="reviewers">
      <div class="rh"><span>Bricks</span><span>Reviewers Notified</span></div>
      ${bricks.map(it=>`<div class="rev-row">
        <span class="bk">${escHtml(it.b)}</span>
        <span class="rev-owners"><span class="owner"><span class="av">${it.av}</span>${it.owner}</span>${ownerMoreHtml(it)}</span>
      </div>`).join('')}
    </div>
    <div class="kv"><div class="k">Bricks Selected</div><div style="margin-top:6px">${bricks.map(it=>`<span class="pill">${it.b}</span>`).join('')}</div></div>
    <div class="notif"><div class="nh">Notifications Sent</div>
      <div class="nrow"><span>${I.bell} In-tool</span><span>${I.teams} Teams</span><span>${I.mail} Email</span></div>
    </div>`;
  // "+N" chip → toggle the tooltip listing the brick's other reviewers.
  c.querySelectorAll('[data-owners]').forEach(node=>node.onclick=(e)=>{
    e.stopPropagation();
    const b=node.dataset.owners;
    ownersOpen = ownersOpen===b ? null : b;
    renderSubmitSuccess(c);
  });
  // mark all steps done
  step=9; renderStepper();
  footer({left:false, secondary:true, primaryLabel:'View Question Bank', primaryIcon:false, onPrimary:()=>{ addToBank('Under Review','review','new'); closeModal(); }});
}
function renderSubmitError(c){
  c.innerHTML = `
    <div class="result-center" style="text-align:center">
      <div class="result-icon" style="background:#FDE3E1">${errIcon()}</div>
      <div class="result-h">Submission failed</div>
      <div class="result-sub">We couldn't submit "${data.label}" for review. Your draft is safe — nothing was lost.</div>
    </div>
    <div class="alert error"><div class="bar">${I.warn}</div><div class="body"><b>Error: the review service is unavailable.</b><br>The question was not added to the review queue. Please try again, or save as a draft and submit later.</div></div>
    <div class="kv"><div class="k">Question</div><div class="v">${data.label}</div></div>
    <div class="kv"><div class="k">Error reference</div><div class="v" style="font-weight:400;color:var(--grey-700)">ERR-SUBMIT-503 · ${new Date().toLocaleTimeString()}</div></div>`;
  footer({left:true, secondary:false, primaryLabel:'Try Again', primaryIcon:false, onPrimary:()=>{ go(9); }});
  if($('#leaveDraft')) $('#leaveDraft').onclick = saveDraftAndLeave;
}
function errIcon(){return '<svg viewBox="0 0 24 24" fill="none" stroke="#EB0C00" stroke-width="2" style="width:32px;height:32px"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16h.01"/></svg>';}

/* ---------- shared ---------- */
function startRedirect(fn){
  let n=10; const t=$('#redirectTxt'); if(!t) return;
  redirectTimer=setInterval(()=>{ n--; if(t.querySelector('b')) t.querySelector('b').textContent=n;
    if(n<=0){ clearInterval(redirectTimer); fn(); } },1000);
}
function addToBank(statusTxt,statusCls,flag){
  const brick = data.bricks[0] || '—';
  const fieldType = atType() ? atType().label : '—';
  // A question saved as a draft was never submitted, so it carries no Internal
  // ID yet. The bank shows that state explicitly rather than a blank cell.
  const id = data.internalId || 'Not yet assigned';
  bankRows = bankRows.filter(r=>r[6]!=='new');
  bankRows.unshift([data.label, id, fieldType, brick, statusCls, statusTxt, flag||'']);
  refreshBank();
}
function toast(msg){
  const t=el(`<div style="position:absolute;left:50%;top:70px;transform:translateX(-50%);background:#0f0f0f;color:#fff;padding:12px 20px;border-radius:8px;z-index:120;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.3)">${msg}</div>`);
  $('#app').appendChild(t); setTimeout(()=>t.remove(),3500);
}

/* =====================================================================
   RESPONSIVE SCALING (fit 1728-wide shell into the window)
   ===================================================================== */
function fit(){
  const app=$('#app'); if(!app) return;
  const w=window.innerWidth, h=window.innerHeight;
  const scale=Math.min(1, w/1728, h/997);          // fit BOTH width and height
  const tx=Math.max(0,(w-1728*scale)/2);           // center horizontally
  const ty=Math.max(0,(h-997*scale)/2);            // center vertically
  app.style.transformOrigin='top left';
  app.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;
  $('#scaleNote').textContent = `Prototype scaled to ${Math.round(scale*100)}% · design canvas 1728×997`;
}
window.addEventListener('resize',fit);

renderShell();
fit();

/* =====================================================================
   STITCH BRIDGE  (additive — nothing above this line is modified)

   This block joins the wizard to manager-review.html when both are hosted
   inside myinstall-admin-config.html. It is ENTIRELY GATED on being framed:
   opening this file on its own behaves exactly as it did before, so Figma
   syncs and standalone demos are unaffected.

   Author persona: on the stitched surface the author is S. Gandhi, which is
   who every manager-review scenario already names as the author. That keeps
   separation of duties intact (FR-QM-MR1) — the reviewer seat stays J. Park,
   so nobody reviews their own submission.
   ===================================================================== */
(function(){
  const FRAMED = window.parent !== window;
  if(!FRAMED) return;                                  // standalone = untouched

  const SURFACE='wizard';
  const AUTHOR={name:'S. Gandhi', av:'SG'};
  let pendingSubmit=null;      // payload waiting for the bank handoff prompt
  let justSubmitted=false;
  let lastPostedId=null;       // dedupe: the success screen re-renders on tooltip clicks

  const post=(type,payload)=>window.parent.postMessage({mi:1,from:SURFACE,type,payload},'*');

  /* ---- bridge-only styles (no existing rule is touched) ---- */
  document.head.appendChild(el(`<style>
    .mi-handoff{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);z-index:130;
      width:620px;background:#fff;border:1px solid var(--grey-200);border-left:4px solid var(--positive-500);
      border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.22);padding:16px 18px;display:flex;gap:14px;}
    .mi-handoff .mi-ic{width:24px;height:24px;flex:none;color:var(--positive-500);}
    .mi-handoff .mi-t{font-weight:700;margin-bottom:4px;}
    .mi-handoff .mi-m{color:var(--grey-700);line-height:20px;}
    .mi-handoff .mi-acts{display:flex;gap:10px;margin-top:12px;}
    .mi-handoff .mi-go{background:var(--primary-500);color:#fff;border:none;border-radius:8px;height:36px;
      padding:0 14px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;}
    .mi-handoff .mi-go svg{width:18px;height:18px;flex:none;}
    .mi-handoff .mi-dismiss{background:none;border:none;color:var(--primary-500);font-size:14px;font-weight:500;padding:0 6px;}
    .nav-item[data-mi-nav]{cursor:pointer;}
  </style>`));

  /* ---- persona + the Review Queue nav item -------------------------------
     The wizard's own NAV has no Governance > Review Queue row (it never needed
     one). Adding it here is what makes the crossing feel like ordinary
     navigation rather than a prototype jump. */
  if(!NAV.some(n=>n.t==='Review Queue')){
    const at=NAV.findIndex(n=>n.t==='Publish Queue');
    NAV.splice(at<0?NAV.length:at+1, 0, {t:'Review Queue', ic:'audit'});
  }

  /* Re-apply the framed chrome after every shell render. */
  const _renderShell=renderShell;
  window.renderShell=function(){
    _renderShell.apply(this,arguments);
    const av=document.querySelector('.unify-header .avatar');
    if(av){ av.textContent=AUTHOR.av; av.title=AUTHOR.name+' · question author'; }
    document.querySelectorAll('.nav-item').forEach(n=>{
      n.setAttribute('data-mi-nav', n.textContent.trim());
    });
  };

  /* The wizard closes back onto the Question Bank — that is where the author
     learns the submission became someone else's work item. */
  const _closeModal=closeModal;
  window.closeModal=function(){
    _closeModal.apply(this,arguments);
    if(justSubmitted && pendingSubmit){ justSubmitted=false; showHandoff(pendingSubmit); }
  };

  /* ---- nav clicks (capture phase, so it works across every re-render) ---- */
  document.addEventListener('click',e=>{
    const item=e.target.closest && e.target.closest('.nav-item');
    if(!item) return;
    const label=item.textContent.trim();
    if(label==='Review Queue'){
      e.stopPropagation(); e.preventDefault();
      post('goto',{surface:'review'});
    } else if(label!=='Questions'){
      e.stopPropagation(); e.preventDefault();
      toast('Outside this prototype — the stitched demo covers Questions and Review Queue.');
    }
  }, true);

  /* ---- submit → hand the question to the reviewer's queue ---------------- */
  function payload(){
    const t=(typeof atType==='function' && atType()) ? atType().label : '—';
    const f=flags();
    return {
      label:      data.label || 'Untitled question',
      internalId: data.internalId || '',
      fieldType:  t,
      bricks:     (data.bricks && data.bricks.length) ? data.bricks.slice() : ['Drive Service'],
      owners:     (data.bricks && data.bricks.length ? data.bricks : ['Drive Service'])
                    .map(brickItem).filter(Boolean)
                    .map(it=>[it.owner].concat(it.more||[])).flat(),
      helpText:   data.helpText || '',
      required:   !!data.requiredToSubmit,
      /* Step 6 found similar bank questions and the author kept going anyway —
         that is precisely the RA12 bank-deliberation branch on the review side. */
      aiFlagged:  !!f.aiMatches,
      ignoredMatch: !!data.ignoredMatch,
      /* Step 8's numbers, so the reviewer's Impact card agrees with what the
         author was shown before submitting. */
      impact:     {portals:14, inprogress:f.noPortals?0:2, templates:3, checklists:0},
      author:     AUTHOR.name,
    };
  }
  const _success=renderSubmitSuccess;
  window.renderSubmitSuccess=function(c){
    _success.apply(this,arguments);
    const p=payload();
    if(p.internalId && p.internalId===lastPostedId) return;   // tooltip re-render
    lastPostedId=p.internalId;
    pendingSubmit=p; justSubmitted=true;
    post('submitted',p);                  // the queue row exists from this moment
  };

  /* The prompt that appears on the Question Bank once the wizard closes —
     the author's cue that the submission is now somebody else's work item. */
  function showHandoff(p){
    const old=document.querySelector('.mi-handoff'); if(old) old.remove();
    const card=el(`<div class="mi-handoff">
      <span class="mi-ic">${I.seal}</span>
      <div>
        <div class="mi-t">“${escHtml(p.label)}” is in review</div>
        <div class="mi-m">Submitted as <b>${AUTHOR.name}</b> · ${escHtml(p.internalId||'ID pending')}. It is now the top row of
          the product owners' Review Queue. You never review your own submission, so crossing over puts you in
          the reviewer's seat (J. Park, ${escHtml(p.bricks[0]||'Drive Service')}).</div>
        <div class="mi-acts">
          <button class="mi-go" id="miGo">Open it in the Review Queue ${I.arrowR}</button>
          <button class="mi-dismiss" id="miNo">Stay on the Question Bank</button>
        </div>
      </div></div>`);
    $('#app').appendChild(card);
    $('#miGo').onclick=()=>{ card.remove(); post('goto',{surface:'review',open:'authored'}); };
    $('#miNo').onclick=()=>card.remove();
  }

  /* ---- host → wizard ---------------------------------------------------- */
  window.addEventListener('message',e=>{
    const m=e.data; if(!m||m.mi!==1) return;
    if(m.type==='open-wizard'){
      const h=document.querySelector('.mi-handoff'); if(h) h.remove();
      if(!modalOpen) openModal();
    }
    if(m.type==='show-bank'){
      if(modalOpen) closeModal();
    }
  });

  renderShell();                          // repaint with the framed chrome
  post('ready',{surface:SURFACE});
})();
<\/script>
</body>
</html>

</script>
<script type="text/plain" id="doc-review">
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MyInstall · Admin Config Tool — Manager Review (Prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   DESIGN TOKENS — Unify palette (same source of truth as the Create
   Question wizard prototype, pulled from the Figma handoff)
   ===================================================================== */
:root{
  --white:#FFFFFF; --black:#000000;
  --grey-50:#F2F2F2; --surface:#F5F5F5; --grey-200:#DFDFDF; --grey-300:#BFBFBF;
  --grey-500:#808080; --grey-700:#606060;
  --primary-500:#196FE1; --primary-100:#DAE4F3; --primary-50:#E8F1FC; --primary-600:#155EBF;
  --info-bar:#2B69BA; --chip-orange-tx:#B95000;
  --error:#EB0C00;
  --warning-500:#FA9C19; --warning-100:#FEF0DC;
  --positive-500:#09AD00; --positive-100:#DAF2D9;
  --info-500:#074FAF; --info-100:#DAE4F3;
  --default-500:#8A8D92; --default-100:#EDEEEE;
  /* diff + escalation colours (unbound in the Figma file — flagged in the guide) */
  --diff-add-bg:#E4F5E3; --diff-add-tx:#0B7A05;
  --diff-del-bg:#FBE3E1; --diff-del-tx:#C21A0F;
  --font:'Roboto',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:var(--font);font-size:14px;line-height:20px;color:var(--black);
  background:#525659;overflow:hidden;}
button{font-family:var(--font);cursor:pointer;}

/* =====================================================================
   APP SHELL — Unify header + left nav + page (1728 x 997)
   ===================================================================== */
.app{width:1728px;height:997px;position:relative;background:var(--white);
  display:flex;flex-direction:column;box-shadow:0 0 40px rgba(0,0,0,.4);overflow:hidden;}
.unify-header{height:48px;background:var(--black);color:#fff;display:flex;align-items:center;
  justify-content:space-between;padding:0 20px;flex:none;}
.unify-header .brand{font-weight:700;font-size:16px;letter-spacing:.5px;}
.unify-header .right{display:flex;align-items:center;gap:18px;}
.unify-header .ic{width:20px;height:20px;color:#fff;opacity:.9;position:relative;display:flex;}
.unify-header .badge{position:absolute;top:-6px;right:-6px;background:var(--error);color:#fff;
  font-size:10px;line-height:14px;border-radius:8px;min-width:15px;height:15px;text-align:center;padding:0 3px;font-weight:500;}
.unify-header .avatar{width:30px;height:30px;border-radius:50%;background:#fff;color:#222;
  font-size:12px;font-weight:500;display:flex;align-items:center;justify-content:center;}
.shell{flex:1;display:flex;min-height:0;}
.nav{width:256px;background:#F2F2F2;color:#000;display:flex;flex-direction:column;flex:none;}
.nav-head{height:60px;display:flex;align-items:center;padding:0 8px;flex:none;}
.nav-switcher{background:#DFDFDF;border-radius:8px;height:36px;display:flex;align-items:center;gap:8px;padding:0 12px 0 6px;width:240px;}
.nav-switcher .logo{width:24px;height:24px;background:#000;border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:7px;color:#fff;font-weight:700;flex:none;}
.nav-switcher .t{font-size:14px;color:#000;}
.nav-divider{height:1px;background:#DFDFDF;width:100%;flex:none;}
.nav-scroll{flex:1;overflow:auto;padding:8px 0;}
.nav-item{height:40px;display:flex;align-items:center;gap:12px;padding:0 16px;color:#000;font-size:14px;cursor:pointer;}
.nav-item:hover{background:#E6E6E6;}
.nav-item.active{background:#DFDFDF;color:#000;font-weight:500;}
.nav-item .ni{width:18px;height:18px;flex:none;display:flex;color:#000;}
.nav-item .nav-pill{margin-left:auto;background:var(--primary-500);color:#fff;font-size:11px;font-weight:700;border-radius:10px;min-width:18px;height:18px;padding:0 5px;display:flex;align-items:center;justify-content:center;}
.nav-section{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px;color:#808080;font-size:12px;font-weight:500;}
.nav-section svg{width:16px;height:16px;color:#808080;flex:none;}
.nav-foot{padding:12px 16px;flex:none;}
.nav-foot .icons{display:flex;gap:18px;color:#000;margin-bottom:12px;}
.nav-foot .icons svg{width:18px;height:18px;}
.nav-foot .brand{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:13px;letter-spacing:.5px;color:#000;}
.nav-foot .collapse{width:28px;height:28px;border:1px solid #BFBFBF;border-radius:4px;display:flex;align-items:center;justify-content:center;background:#fff;color:#000;}

.page{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--white);}
.page-header{min-height:100px;display:flex;align-items:center;justify-content:space-between;padding:20px 24px;flex:none;gap:16px;}
.page-title{font-size:28px;line-height:36px;font-weight:400;}
.page-sub{font-size:14px;color:var(--grey-700);margin-top:4px;}
.page-body{flex:1;min-height:0;overflow:auto;padding:0 24px 24px;}

/* buttons */
/* Buttons — Figma: padding 9px 12px, radius 8, Roboto Medium 14/18, tracking .25 */
.btn-primary{background:var(--primary-500);color:#fff;border:none;border-radius:8px;padding:9px 12px;line-height:18px;
  font-size:14px;font-weight:500;letter-spacing:.25px;display:inline-flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap;}
.btn-primary:hover{background:var(--primary-600);}
.btn-primary:disabled{background:var(--grey-200);color:var(--grey-500);cursor:not-allowed;}
.btn-secondary{background:var(--primary-50);color:var(--primary-600);border:none;border-radius:8px;padding:9px 12px;line-height:18px;font-size:14px;font-weight:500;letter-spacing:.25px;display:inline-flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap;}
.btn-secondary:hover{background:#d9e9fb;}
.btn-secondary:disabled{background:var(--surface);color:var(--grey-300);cursor:not-allowed;}
.btn-ghost{background:#fff;border:1px solid var(--grey-300);color:#000;border-radius:8px;padding:8px 12px;line-height:18px;font-size:14px;font-weight:500;letter-spacing:.25px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;}
.btn-ghost:hover{background:var(--surface);}
.btn-danger{background:#fff;border:1px solid var(--error);color:var(--error);border-radius:8px;padding:8px 12px;line-height:18px;font-size:14px;font-weight:500;letter-spacing:.25px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;}
.btn-danger:hover{background:#fdeeed;}
.link-btn{background:none;border:none;color:var(--primary-500);font-size:14px;font-weight:500;padding:6px;display:inline-flex;align-items:center;gap:4px;letter-spacing:.25px;}
.link-danger{background:none;border:none;color:var(--error);font-size:14px;font-weight:500;padding:6px;display:inline-flex;align-items:center;gap:4px;letter-spacing:.25px;}
.btn-primary svg,.btn-secondary svg,.btn-ghost svg,.btn-danger svg,.link-btn svg,.link-danger svg{width:18px;height:18px;flex:none;}

/* =====================================================================
   REVIEW QUEUE  (scenario picker — each row is a question in the bank)
   ===================================================================== */
.q-filters{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.fchips{display:flex;gap:8px;}
.fchip{height:32px;border:1px solid var(--grey-300);border-radius:16px;background:#fff;padding:0 12px;display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#333;cursor:pointer;}
.fchip svg{width:14px;height:14px;color:var(--grey-500);}
.q-search{position:relative;}
.q-search input{width:300px;height:36px;border:1px solid var(--grey-300);border-radius:18px;padding:0 14px 0 38px;font-size:14px;font-family:var(--font);outline:none;}
.q-search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--grey-500);}
table.qb{width:100%;border-collapse:collapse;}
table.qb th{text-align:left;font-size:12px;font-weight:500;color:var(--grey-700);padding:10px 12px;border-bottom:1px solid var(--grey-300);}
table.qb td{padding:12px;font-size:14px;border-bottom:1px solid var(--grey-200);vertical-align:middle;color:#000;}
table.qb tbody tr{cursor:pointer;}
table.qb tbody tr:hover{background:#F7F9FE;}
.qb .qname{font-weight:400;}
.col-cb{width:40px;}
.cbx{width:18px;height:18px;border:1.5px solid var(--grey-300);border-radius:4px;display:inline-block;background:#fff;vertical-align:middle;}
.prod-cell{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.prod-chip{border:1px solid var(--grey-300);border-radius:12px;padding:2px 10px;font-size:12px;background:#fff;color:var(--grey-700);white-space:nowrap;}
.prod-more{font-size:12px;color:var(--grey-500);}
.chip{display:inline-flex;align-items:center;border:2px solid var(--default-500);border-radius:2px;padding:3px 8px;font-size:12px;line-height:14px;font-weight:500;background:var(--default-100);color:#000;white-space:nowrap;}
.chip.artifact{border-radius:12px;}
.sla{display:inline-flex;align-items:center;border:2px solid;border-radius:2px;padding:3px 8px;font-size:12px;line-height:14px;font-weight:500;color:#000;white-space:nowrap;}
.sla.ok{background:var(--positive-100);border-color:var(--positive-500);}
.sla.amber{background:var(--warning-100);border-color:var(--warning-500);}
.sla.red{background:#FDE3E1;border-color:var(--error);}
.owners-cell{display:flex;align-items:center;}
.av{width:26px;height:26px;border-radius:50%;background:var(--grey-700);color:#fff;font-size:11px;font-weight:500;display:flex;align-items:center;justify-content:center;flex:none;border:2px solid #fff;}
.av.stacked{margin-left:-8px;}
.av.you{background:var(--primary-500);}
.flag-pill{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--warning-500);color:var(--warning-500);border-radius:12px;padding:2px 9px;font-size:11px;font-weight:500;background:var(--warning-100);}
.flag-pill svg{width:12px;height:12px;}
.status-pill{display:inline-flex;align-items:center;border-radius:4px;padding:3px 10px;font-size:12px;font-weight:500;border:1px solid;background:#fff;}
.status-pill.review{color:var(--primary-500);border-color:var(--primary-500);}
.status-pill.deliberation{color:var(--warning-500);border-color:var(--warning-500);}
.status-pill.resolved{color:var(--positive-500);border-color:var(--positive-500);}
.status-pill.withdrawn{color:var(--grey-500);border-color:var(--grey-300);}
.pagination{display:flex;align-items:center;justify-content:flex-end;gap:18px;padding:16px 12px;color:var(--grey-700);font-size:13px;}
.pagination svg{width:16px;height:16px;flex:none;vertical-align:middle;}
/* queue — reviewers column (coloured status dot + name) */
.rev-cell{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.rev{display:inline-flex;align-items:center;gap:7px;font-size:14px;color:#000;white-space:nowrap;}
.rdot{width:8px;height:8px;border-radius:50%;flex:none;}
.rdot.green{background:var(--positive-500);}
.rdot.amber{background:var(--warning-500);}
.rdot.red{background:var(--error);}
.rev-more{font-size:14px;color:var(--grey-500);}
/* RDS status banner — Figma banner component: solid coloured icon cap (icon at top) + white
   body with a 2px matching border, one rounded-8 box. Statuses per RDS:
   info #2B69BA · warning #FAAA3B · positive #2DB926 · negative #EB0C00 */
.rds-banner{display:flex;align-items:stretch;border:2px solid;border-radius:8px;overflow:hidden;background:#fff;margin:0;}
.rds-banner .rb-ic{flex:none;width:40px;display:flex;align-items:flex-start;justify-content:center;padding:13px 8px 8px;color:#fff;}
.rds-banner .rb-ic svg{width:24px;height:24px;}
.rds-banner .rb-body{flex:1;min-width:0;padding:14px 16px;display:flex;flex-direction:column;gap:12px;justify-content:center;}
.rds-banner .rb-msg{font-size:14px;font-weight:500;line-height:20px;color:#000;}
.rds-banner .rb-actions{display:flex;gap:8px;justify-content:flex-end;align-items:center;}
.rds-banner .rb-actions button{background:none;border:none;color:var(--primary-500);font-size:14px;font-weight:500;letter-spacing:.25px;line-height:18px;padding:9px 8px;cursor:pointer;}
.rds-banner.info{border-color:#2B69BA;} .rds-banner.info .rb-ic{background:#2B69BA;}
.rds-banner.warning{border-color:#FAAA3B;} .rds-banner.warning .rb-ic{background:#FAAA3B;}
.rds-banner.positive{border-color:#2DB926;} .rds-banner.positive .rb-ic{background:#2DB926;}
.rds-banner.negative{border-color:var(--error);} .rds-banner.negative .rb-ic{background:var(--error);}
/* queue — empty state (state 4) */
.q-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:150px 20px 20px;}
.q-empty .qe-h{font-size:18px;font-weight:700;margin-bottom:10px;}
.q-empty .qe-s{font-size:14px;color:var(--grey-500);max-width:600px;line-height:20px;}
/* prototype scaffold — queue-state switcher (out-of-design demo control) */
.qstate-switch,.cvstate-switch{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:2px;
  background:rgba(0,0,0,.72);border-radius:9px;padding:4px;z-index:150;font-family:var(--font);box-shadow:0 4px 14px rgba(0,0,0,.3);}
.qstate-switch .lbl,.cvstate-switch .lbl{color:#8f8f8f;font-size:10px;font-weight:500;padding:0 8px 0 6px;text-transform:uppercase;letter-spacing:.6px;}
.qstate-switch button,.cvstate-switch button{background:none;border:none;color:#d0d0d0;font-size:11px;font-weight:500;padding:5px 11px;border-radius:6px;cursor:pointer;}
.qstate-switch button:hover,.cvstate-switch button:hover{color:#fff;}
.qstate-switch button.on,.cvstate-switch button.on{background:var(--primary-500);color:#fff;}

/* =====================================================================
   REVIEW CANVAS
   ===================================================================== */
.sla-nudge{display:flex;align-items:center;gap:12px;padding:10px 24px;font-size:13px;font-weight:500;}
.sla-nudge svg{width:18px;height:18px;flex:none;}
.sla-nudge.amber{background:var(--warning-100);color:#8a5a00;border-bottom:1px solid #f2d9a8;}
.sla-nudge.red{background:#FDE3E1;color:#a3160c;border-bottom:1px solid #f4b6b0;}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--grey-200);}
.tab{padding:4px 16px 12px;font-size:14px;font-weight:500;color:#000;cursor:pointer;border-bottom:2px solid transparent;display:inline-flex;align-items:center;gap:6px;margin-bottom:-1px;}
.tab.active{color:#000;border-bottom-color:var(--grey-500);}
.tab .tab-count{color:var(--grey-500);font-weight:400;}
.tab.disabled{color:var(--grey-300);cursor:not-allowed;}
.meta-row{display:flex;align-items:center;gap:12px;padding:16px 0;flex-wrap:wrap;}
.meta-row .desc{font-size:14px;line-height:20px;color:#6E6E6E;}
.canvas-grid{display:flex;gap:24px;padding:16px 0 8px;align-items:flex-start;}
.canvas-main{flex:1;min-width:0;}
.canvas-rail{width:360px;flex:none;}
/* deliberation — thread scrolls, composer pinned to the bottom */
.delib-layout{display:flex;flex-direction:column;height:100%;min-height:0;}
.delib-top{flex:none;}
.delib-cols{flex:1;min-height:0;display:flex;gap:24px;padding-top:8px;}
.delib-main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;}
.delib-thread{flex:1;min-height:0;overflow-y:auto;padding-right:10px;}
.delib-composer{flex:none;padding-top:12px;}
.delib-rail{width:360px;flex:none;display:flex;flex-direction:column;overflow:hidden;}
/* Required approvals — card fills the rail and scrolls internally.
   Figma: Rail FILL · Card · Approvals FILL + maxHeight 411 (the cap stops the
   card stretching to ~660px of white space on the wider deliberation states).
   Approver list is a clipped scroll area, same grammar as the Timeline. */
.rail-card.approvals{display:flex;flex-direction:column;flex:1;min-height:0;max-height:411px;overflow:hidden;}
.rail-card.approvals>.rc-note{flex:none;margin-bottom:0;}
.appr-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex:none;}
.appr-head h4{margin:0 0 6px;}
.appr-count{font-size:12px;line-height:14px;color:#939393;flex:none;white-space:nowrap;}
.appr-divider{height:1px;background:var(--grey-200);margin-top:12px;flex:none;}
.appr-summary{font-size:12px;line-height:14px;color:#424242;padding-top:12px;flex:none;}
.appr-scroll{flex:1;min-height:0;overflow-y:auto;margin-top:12px;}
.appr-scroll.scrolls{padding-right:12px;}
.appr-scroll .approver:last-child{margin-bottom:0;}
.appr-scroll::-webkit-scrollbar{width:6px;}
.appr-scroll::-webkit-scrollbar-track{background:rgba(0,0,0,.06);border-radius:3px;}
.appr-scroll::-webkit-scrollbar-thumb{background:rgba(0,0,0,.32);border-radius:3px;}

/* AI flag callout */
.ai-callout{border:1px solid var(--warning-500);background:var(--warning-100);border-radius:10px;padding:16px 18px;margin-bottom:18px;}
.ai-callout .ah{display:flex;align-items:center;gap:8px;font-weight:700;color:#8a5a00;}
.ai-callout .ah svg{width:18px;height:18px;}
.ai-callout .ad{font-size:13px;color:#7a5300;margin:8px 0 12px;}
.ai-decl{background:#fff;border:1px solid #f2d9a8;border-radius:8px;padding:10px 12px;font-size:13px;color:var(--grey-700);}
.ai-decl b{color:var(--black);}
.ai-match{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #f2d9a8;border-radius:8px;padding:10px 12px;margin-top:8px;}
.badge-sim{border:1px solid var(--error);color:var(--error);border-radius:4px;padding:2px 8px;font-size:12px;font-weight:700;flex:none;}
.ai-match .mq{font-weight:500;}
.ai-match .mm{font-size:12px;color:var(--grey-500);letter-spacing:.3px;text-transform:uppercase;}
.ai-match .mr{margin-left:auto;font-size:12px;color:var(--grey-500);}
/* AI similarity tab (Figma Step 3 — scan results + match cards) */
.ai-scan-head{margin:16px 0 4px;}
.ai-scan-head .h{font-size:18px;font-weight:700;line-height:24px;}
.ai-scan-head .s{font-size:14px;color:var(--grey-700);margin-top:4px;}
.ai-group-head{display:flex;align-items:center;justify-content:space-between;margin:24px 0 12px;}
.ai-group-head .gt{font-size:15px;font-weight:500;}
.ai-group-head .rec{font-size:13px;color:var(--grey-500);}
.match-card{border:1px solid var(--grey-200);border-radius:10px;padding:16px 20px;margin-bottom:12px;}
.match-card.sel{border-color:var(--primary-500);box-shadow:0 0 0 1px var(--primary-500);}
.mc-summary{cursor:pointer;}
.mc-toprow{display:flex;align-items:center;}
.mc-badges{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.mc-chev{margin-left:auto;color:var(--grey-500);display:flex;flex:none;}
.mc-chev svg{width:20px;height:20px;}
.mc-title{font-size:15px;font-weight:500;margin-top:12px;}
.mc-idrow{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:4px;}
.mc-id{font-size:12px;letter-spacing:.5px;color:var(--grey-500);text-transform:uppercase;}
.mc-right{font-size:13px;color:var(--grey-500);white-space:nowrap;}
.simbadge{border:1px solid;border-radius:4px;padding:2px 8px;font-size:12px;font-weight:700;white-space:nowrap;background:#fff;}
.simbadge.red{color:var(--error);border-color:var(--error);}
.simbadge.amber{color:var(--chip-orange-tx);border-color:var(--warning-500);}
.stbadge{border:1px solid;border-radius:4px;padding:2px 8px;font-size:12px;font-weight:500;white-space:nowrap;background:#fff;}
.stbadge.active{color:var(--positive-500);border-color:var(--positive-500);}
.stbadge.inactive{color:var(--grey-500);border-color:var(--grey-300);}
.stbadge.choice{color:var(--positive-500);border-color:var(--positive-500);}
.mc-body{border-top:1px solid var(--grey-200);margin-top:14px;padding-top:14px;}
.mc-note{font-size:13px;color:var(--grey-700);margin-bottom:10px;}
.mc-why{background:var(--surface);border:1px solid var(--grey-200);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--grey-700);margin-bottom:14px;}
.mc-why .k{font-weight:500;color:#000;margin-bottom:2px;}
.mc-action{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;}
.mc-action .ma-t{font-weight:500;font-size:14px;}
.mc-action .ma-d{font-size:13px;color:var(--grey-700);margin-top:2px;}
/* adopt split-button + dropdown menu (Use as is / Use & Edit) */
.split-wrap{position:relative;flex:none;}
.split-btn svg{margin-left:6px;padding-left:8px;border-left:1px solid rgba(21,94,191,.35);}
.ai-menu{position:absolute;top:calc(100% + 6px);right:0;width:290px;background:#fff;border:1px solid var(--grey-200);
  border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:6px;z-index:40;}
.ai-menu-item{padding:10px 12px;border-radius:8px;cursor:pointer;}
.ai-menu-item:hover{background:var(--surface);}
.ai-menu-item .t{font-weight:700;font-size:14px;}
.ai-menu-item .d{font-size:13px;color:var(--grey-700);margin-top:2px;line-height:18px;}

/* section card */
.card{border:1px solid var(--grey-200);border-radius:10px;overflow:hidden;margin-bottom:18px;}
.card-head{background:var(--surface);display:flex;align-items:center;gap:10px;padding:12px 16px;font-weight:700;cursor:pointer;}
.card-head .ch-right{margin-left:auto;color:var(--grey-500);font-size:13px;font-weight:400;display:inline-flex;align-items:center;gap:8px;}
.card-head .ch-right svg{width:18px;height:18px;}
.card-body{padding:16px;}
.diff-field{margin-bottom:16px;}
.diff-field:last-child{margin-bottom:0;}
.diff-field .dl{font-weight:500;font-size:13px;margin-bottom:6px;}
.diff-line{border-radius:6px;padding:9px 12px;font-size:13px;line-height:18px;margin-bottom:6px;display:flex;gap:8px;}
.diff-line:last-child{margin-bottom:0;}
.diff-line .sign{font-weight:700;}
.diff-line.add{background:var(--diff-add-bg);color:var(--diff-add-tx);}
.diff-line.del{background:var(--diff-del-bg);color:var(--diff-del-tx);}
/* Review tab — single column */
.review-wrap{padding-top:16px;}
.changes-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:14px;}
.sec-title{font-size:16px;font-weight:700;line-height:20px;}
.changes-sub{font-size:13px;color:#6E6E6E;margin-top:4px;}
.changes-chips{display:flex;gap:8px;align-items:center;flex:none;}
.diff-card{border:1px solid var(--grey-200);border-radius:10px;padding:14px 16px;margin-bottom:12px;}
.diff-card-label{font-size:13px;font-weight:500;margin-bottom:8px;}
.approver-chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;}
.appr-chip{display:flex;gap:8px;align-items:center;border:1px solid var(--grey-200);border-radius:20px;padding:5px 14px 5px 5px;background:#fff;}
.appr-chip .av{width:30px;height:30px;font-size:13px;border:none;}
.appr-chip .ac-n{font-size:14px;font-weight:500;line-height:16px;}
.appr-chip .ac-st{font-size:12px;line-height:14px;margin-top:2px;}
.ac-st.pending{color:var(--grey-500);} .ac-st.approved{color:var(--positive-500);}
.ac-st.rejected{color:var(--error);} .ac-st.proposed{color:var(--warning-500);}
.dep-impact{display:flex;gap:16px;align-items:stretch;}

   The row sits at the TOP of the thread (it collapses the older replies), and on
   click the skeleton renders ABOVE it so the row slides down and the load is visible. */
.earlier-row{display:flex;align-items:center;gap:12px;padding:6px 0;}
.earlier-row::before,.earlier-row::after{content:"";flex:1;height:1px;background:var(--grey-200);}

.field input,.field textarea,.field select{border:none;outline:none;background:transparent;font-size:15px;font-family:var(--font);width:100%;color:var(--black);resize:vertical;}
.field textarea{min-height:70px;}
.field.locked{background:var(--grey-50);}
.helper{font-size:12px;color:var(--grey-500);margin:2px 2px 14px;}
.lock-note{background:var(--primary-100);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--info-500);display:flex;gap:8px;align-items:flex-start;margin-bottom:16px;}
.lock-note svg{width:16px;height:16px;flex:none;margin-top:1px;}
.field-group-label{font-size:13px;font-weight:700;margin:14px 0 6px;}
/* version chooser radio cards */
.vchoose{border:1.5px solid var(--grey-200);border-radius:10px;padding:14px 16px;margin-bottom:12px;display:flex;gap:12px;cursor:pointer;}
.vchoose.sel{border-color:var(--primary-500);background:var(--primary-100);}
.vchoose.disabled{opacity:.55;cursor:not-allowed;}
.vchoose .radio{width:20px;height:20px;border:2px solid var(--grey-300);border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;margin-top:1px;background:#fff;}
.vchoose.sel .radio{border-color:var(--primary-500);}
.vchoose.sel .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--primary-500);}
.vchoose .vc-t{font-weight:700;font-size:14px;}
.vchoose .vc-d{font-size:13px;color:var(--grey-700);margin-top:2px;}
/* dealer preview modal */
.preview-banner{background:var(--info-100);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--info-500);display:flex;gap:8px;align-items:flex-start;margin-bottom:16px;}
.preview-banner svg{width:16px;height:16px;flex:none;margin-top:1px;}
.dealer-frame{border:1px solid var(--grey-300);border-radius:10px;padding:22px;background:var(--surface);}
.dealer-q{font-size:16px;font-weight:500;margin-bottom:10px;}
.dealer-input{background:#fff;border:1px solid var(--grey-300);border-radius:8px;padding:12px 14px;color:var(--grey-500);}
.dealer-hint{font-size:13px;color:var(--grey-500);margin-top:8px;}
/* RA12 similarity resolution options */
.ra-opt{border:1px solid var(--grey-200);border-radius:10px;padding:14px 16px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start;cursor:pointer;}
.ra-opt:hover{border-color:var(--primary-500);background:var(--primary-100);}
.ra-opt .ra-ic{width:34px;height:34px;border-radius:8px;background:var(--primary-100);color:var(--primary-500);display:flex;align-items:center;justify-content:center;flex:none;}
.ra-opt .ra-ic svg{width:18px;height:18px;}
.ra-opt .ra-t{font-weight:700;font-size:14px;}
.ra-opt .ra-d{font-size:13px;color:var(--grey-700);margin-top:2px;}
.ra-opt .ra-badge{margin-left:auto;font-size:11px;color:var(--grey-500);align-self:center;}
/* propose-your-version wizard — fixed 900×700 dialog, independent-scroll stepper + content
   (matches question-creation-wizard). Connector = short 18px segments between circles. */
.wiz-dialog{width:900px;height:700px;max-height:none;}
.dlg-mid{flex:1;display:flex;min-height:0;}
.stepper{width:212px;flex:none;border-right:1px solid var(--grey-200);padding:20px 14px;overflow:auto;}
.step-wrap{padding:6px 0;}
.step-row{display:flex;align-items:flex-start;gap:12px;position:relative;}
.step-row .num{width:28px;height:28px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;color:#fff;background:var(--grey-300);}
.step-row .num svg{width:16px;height:16px;}
.step-row.active .num{background:var(--primary-500);}
.step-row.done .num{background:var(--primary-500);color:#fff;}
.step-row .lbl{font-size:14px;color:var(--grey-700);padding-top:5px;}
.step-row.active .lbl{color:#000;font-weight:500;}
.step-row.done .lbl{color:#000;}
.step-row.active{background:var(--primary-100);border-radius:8px;padding:0 8px;margin:0 -8px;}
.step-row.clickable{cursor:pointer;border-radius:8px;padding:0 8px;margin:0 -8px;}
.step-row.clickable:hover{background:var(--grey-50);}
.connector{width:2px;height:18px;background:var(--grey-300);margin-left:13px;}
.connector.done{background:var(--primary-500);}
.dlg-content{flex:1;min-width:0;padding:24px 28px;overflow:auto;}
.wiz-h{font-size:16px;font-weight:700;}
.wiz-sub{font-size:14px;color:var(--grey-700);margin:4px 0 20px;}
.toggle-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;}
.toggle-row .tr-t{font-weight:700;font-size:14px;} .toggle-row .tr-d{font-size:13px;color:var(--grey-700);margin-top:2px;max-width:520px;}
.toggle{width:40px;height:22px;border-radius:11px;background:var(--grey-300);position:relative;flex:none;cursor:pointer;transition:background .15s;margin-top:2px;}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s;}
.toggle.on{background:var(--primary-500);} .toggle.on::after{left:20px;}
.wiz-search{position:relative;margin-bottom:14px;}
.wiz-search input{width:100%;height:40px;border:1px solid var(--grey-300);border-radius:20px;padding:0 14px 0 40px;font-size:14px;font-family:var(--font);outline:none;}
.wiz-search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--grey-500);}
.brick-group-head{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:6px;padding:9px 14px;margin-top:8px;font-weight:500;font-size:14px;}
.brick-row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--grey-200);font-size:14px;}
.brick-row .br-owner{margin-left:auto;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--grey-200);border-radius:16px;padding:3px 12px 3px 4px;font-size:13px;}
.brick-row .br-owner .av{width:26px;height:26px;font-size:11px;border:none;background:var(--grey-700);}
.cbx.checked{background:var(--primary-500);border-color:var(--primary-500);position:relative;}
.cbx.checked::after{content:"";position:absolute;left:5px;top:1px;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);}
.cbx{cursor:pointer;}
.diff3{border:1px solid var(--grey-200);border-radius:10px;padding:14px 16px;margin-bottom:12px;}
.diff3 .d3-l{font-size:13px;color:var(--grey-700);margin-bottom:8px;}
.diff3 .d3-line{border-radius:6px;padding:9px 12px;font-size:13px;line-height:18px;margin-bottom:6px;}
.diff3 .d3-line:last-child{margin-bottom:0;}
.d3-line.orig{background:var(--diff-del-bg);color:var(--diff-del-tx);}
.d3-line.auth{background:var(--grey-50);color:var(--grey-700);}
.d3-line.mine{background:var(--diff-add-bg);color:var(--diff-add-tx);}

/* toast */
.toast{position:absolute;right:32px;bottom:96px;width:380px;z-index:120;display:flex;border-radius:8px;overflow:hidden;border:1px solid;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.18);}
.toast .bar{width:40px;flex:none;display:flex;align-items:flex-start;justify-content:center;padding-top:16px;color:#fff;}
.toast .bar svg{width:22px;height:22px;}
.toast .tb{flex:1;padding:14px 16px;}
.toast .tt{font-weight:500;} .toast .tm{font-size:13px;color:var(--grey-700);margin-top:2px;}
.toast.positive{border-color:var(--positive-500);} .toast.positive .bar{background:var(--positive-500);}
.toast.info{border-color:var(--primary-500);} .toast.info .bar{background:var(--primary-500);}
.toast.warning{border-color:var(--warning-500);} .toast.warning .bar{background:var(--warning-500);}
/* prototype scaffold — stacked switcher rows (author notification gallery) */
.switch-stack{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:150;}
.cvstate-switch.inline{position:static;transform:none;bottom:auto;left:auto;}

.scale-note{position:fixed;left:12px;bottom:12px;background:rgba(0,0,0,.7);color:#fff;font-size:11px;padding:6px 10px;border-radius:6px;z-index:200;font-family:var(--font);}
.demo-tag{position:fixed;right:12px;bottom:12px;background:var(--primary-500);color:#fff;font-size:11px;font-weight:500;padding:6px 12px;border-radius:14px;z-index:200;font-family:var(--font);box-shadow:0 4px 12px rgba(0,0,0,.25);}

function depCard(s,dep){

function matchCard(s,m){

function renderAITab(s){

function openAdopt(s,matchId){
  const m=s.ai.matches.find(x=>x.id===matchId);

  overlay(`<div class="scrim"><div class="dialog" style="width:640px">

  go.onclick=()=>{ if(go.disabled)return; s._aiChoice=matchId; s._aiExpanded=matchId; closeOverlay(); render();
    toast('positive','Choice recorded',`Your decision to use “${m.q}” is saved to the audit log.`); };
}

function stripTags(h){ const d=document.createElement('div'); d.innerHTML=h||''; return d.textContent||''; }
function textBeforeCaret(ce){
  const sel=window.getSelection(); if(!sel.rangeCount) return '';
  const r=sel.getRangeAt(0);

function insertTag(name){

      if(m){ node.textContent=before.slice(0,m.index)+text.slice(pos); range.setStart(node,m.index); range.setEnd(node,m.index); } }
    const span=document.createElement('span'); span.className='tag'; span.textContent='@'+name; range.insertNode(span);
    const space=document.createTextNode(' '); span.after(space);
    range.setStartAfter(space); range.setEndAfter(space); sel.removeAllRanges(); sel.addRange(range);
  } else { ce.insertAdjacentHTML('beforeend', `<span class="tag">@${esc(name)}</span>&nbsp;`); }
  composerAnchor=name; const ch=$('#anchorChip'); if(ch) ch.textContent='on: '+name;

}

  myApproveVersion=fromVersion||'original'; reviewerDecided=true;

  let title, body, btn, onGo;

    title=`Approve D. Wang’s proposed edit?`;
    body=`You’re approving D. Wang’s proposed edit of ${vLast} — not ${s.author}’s original. Approvals attach to one exact version: this change publishes only once every required approver has approved this same proposal. Approving here does not approve ${vLast}.`;
    btn=`Approve D. Wang’s version`;

  } else if(myVersionVotes===0){
    // Case B — you have a proposed version with no votes

/* Propose your version — 4-step wizard (Figma Step 4:
   Answer Type · Brick Applicability · Conditional Logic · Review & submit) */
function openPropose(){
  const s=sc();
  const steps=['Answer Type','Brick Applicability','Conditional Logic','Review & submit'];
  let step=1;
  const st={ required:true, bricks:new Set(['Drive Service']), cond:true, rationale:'' };
  const bricks=[
    {g:'DMS',             ow:['DM','David Kim'], it:['Drive DMS','Drive Accounting','Drive F&I Sales']},
    {g:'Fixed Operations',ow:['SC','Sarah Chen'],it:['Drive Service','Drive Parts','Appointment Scheduling']},
    {g:'CRM',             ow:['RO','R. Okafor'], it:['Elead CRM','Roadster','BDC Suite']},
  ];
  let maxStep=1;
  const origVer=(s.ver.split('→')[0]||'v3').trim();
  const authVer=s.ver==='new'?'v1':(s.ver.split('→').pop()||'v4').trim();
  function stepperHtml(){
    return steps.map((l,i)=>{
      const n=i+1; let cls='',circle=n;
      if(n===step) cls='active';
      else if(n<=maxStep){ cls='done'; circle=I.vcheck; }
      const reachable = n<=maxStep && n!==step;
      const conn = i<steps.length-1 ? `<div class="connector ${n<maxStep?'done':''}"></div>` : '';
      return `<div class="step-wrap"><div class="step-row ${cls} ${reachable?'clickable':''}" ${reachable?`data-wstep="${n}"`:''}><div class="num">${circle}</div><div class="lbl">${l}</div></div>${conn}</div>`;
    }).join('');
  }
  function contentHtml(){
    if(step===1) return `<div class="wiz-h">Answer Type</div><div class="wiz-sub">Set the answer requirement for this question.</div>
      <div class="toggle-row"><div><div class="tr-t">Required to submit</div><div class="tr-d">Dealers must answer before submitting.</div></div>
      <span class="toggle ${st.required?'on':''}" data-wtog="required"></span></div>`;
    if(step===2) return `<div class="wiz-h">Brick Applicability</div><div class="wiz-sub">This question will appear in onboarding portals for the bricks selected below.</div>
      <div class="wiz-search">${I.search}<input placeholder="Search Bricks or Workstreams"></div>
      ${bricks.map(gr=>`<div class="brick-group-head"><span class="cbx"></span>${gr.g}</div>
        ${gr.it.map(it=>`<div class="brick-row"><span class="cbx ${st.bricks.has(it)?'checked':''}" data-wbrick="${escAttr(it)}"></span><span style="flex:1">${it}</span>
          <span class="br-owner"><span class="av">${gr.ow[0]}</span>${gr.ow[1]}</span></div>`).join('')}`).join('')}`;
    if(step===3) return `<div class="wiz-h">Conditional Logic</div><div class="wiz-sub">Control when this question appears, based on product scope or other answers.</div>
      <div class="toggle-row"><div><div class="tr-t">Hide in portals where Drive Service is not in scope</div><div class="tr-d">Accounting still receives the date through this rule instead of a duplicate question.</div></div>
      <span class="toggle ${st.cond?'on':''}" data-wtog="cond"></span></div>`;
    const mine=s.proposeMine||[];
    const cards=s.diff.map((d,i)=>{
      const o=d.rows.find(r=>r[0]==='-'), a=d.rows.find(r=>r[0]==='+');
      const ov=o?o[1]:'—', av=a?a[1]:(o?o[1]:'—'), mv=mine[i]||(av+' (unchanged)');
      return `<div class="diff3"><div class="d3-l">${esc(d.f)}</div>
        <div class="d3-line orig">−&nbsp; ${origVer} · Original — ${esc(ov)}</div>
        <div class="d3-line auth">·&nbsp; ${authVer} · Author (${s.author}) — ${esc(av)}</div>
        <div class="d3-line mine">+&nbsp; Your version — ${esc(mv)}</div></div>`;
    }).join('');
    return `<div class="wiz-h">Review &amp; submit</div><div class="wiz-sub">Compare the original, the author’s ${authVer}, and your version field by field, then submit your proposal.</div>
      ${cards}

  }
  function footHtml(){
    if(step<4) return `<button class="link-btn spread" data-wcancel>Cancel</button>
      <button class="btn-primary" data-wnext>Continue to ${steps[step]} ${I.arrowR}</button>`;

      <button class="btn-primary" data-wsubmit ${st.rationale.trim()?'':'disabled'}>Propose edit ${I.arrowR}</button>`;

    const nx=$('[data-wnext]'); if(nx) nx.onclick=()=>{ syncRat(); step++; draw(); };
    $$('[data-wtog]').forEach(t=>t.onclick=()=>{ syncRat(); st[t.dataset.wtog]=!st[t.dataset.wtog]; draw(); });
    $$('[data-wbrick]').forEach(c=>c.onclick=()=>{ const k=c.dataset.wbrick; st.bricks.has(k)?st.bricks.delete(k):st.bricks.add(k); draw(); });

    const sub=$('[data-wsubmit]'); if(sub) sub.onclick=()=>{ if(!st.rationale.trim())return; doProposeSave(s); };

/* Reject (mandatory reason — Figma Decision State 3) */
function openReject(){
  const s=sc();
  const ph = s.id==='warranty'
    ? 'Warranty opt-in is an F&I-only concept. Adding it to Service and Parts portals would confuse dealers and duplicate data captured in F&I.'
    : 'The applicability change conflicts with the Accounting rollout plan — Accounting portals still need this at go-live.';
  overlay(`<div class="scrim"><div class="dialog" style="width:600px">
    <div class="dlg-head"><div class="title">Reject this change?</div><button class="x" id="rjX">${I.x}</button></div>
    <div class="dlg-body">
      <p style="margin:0 0 14px;line-height:20px">A reason is required. The author sees it verbatim, together with the full review context.</p>
      <div class="field"><div class="flabel">Reason</div>
        <textarea id="rjText" placeholder="${escAttr(ph)}"></textarea></div>
    </div>
    <div class="dlg-foot"><button class="link-btn spread" id="rjCancel">Cancel</button>
      <button class="btn-primary" id="rjSubmit" disabled>Reject with reason</button></div>
  </div></div>`);
  $('#rjX').onclick=closeOverlay; $('#rjCancel').onclick=closeOverlay;
  const txt=$('#rjText'), sub=$('#rjSubmit');
  txt.oninput=()=>{ sub.disabled=!txt.value.trim(); };
  sub.onclick=()=>{
    if(!txt.value.trim())return;
    closeOverlay(); reviewerDecided=true;
    if(s.owners.length===1){ finish('rejected'); return; }
    s._othersRevealed=Object.assign({}, s.othersOnReject||{});
    const allReject = s.owners.filter(o=>!o.you).every(o=>s._othersRevealed[o.av]==='rejected');
    if(allReject){ toast('info','Consensus reject','All owners rejected — finalising as Rejected.'); setTimeout(()=>finish('rejected'),700); }
    else { toast('info','Owners disagree','Decisions are mixed — moving to Deliberation.'); s._delibMode='content'; tab='deliberation'; render(); }
  };
}

/* =====================================================================
   SCALING
   ===================================================================== */
function fit(){
  const app=$('#app'); if(!app)return;
  const w=window.innerWidth,h=window.innerHeight;
  const scale=Math.min(1,w/1728,h/997);
  const tx=Math.max(0,(w-1728*scale)/2), ty=Math.max(0,(h-997*scale)/2);
  app.style.transformOrigin='top left';
  app.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;
  const sn=$('#scaleNote');
  sn.textContent=`Prototype scaled to ${Math.round(scale*100)}% · 1728×997`;
  sn.style.display = scale>=0.999 ? 'none' : 'block';   // hide when full-size so it never covers the footer
}
window.addEventListener('resize',fit);
render(); fit();

/* =====================================================================
   STITCH BRIDGE  (additive — nothing above this line is modified)

   Joins this prototype to question-creation-wizard_updated.html when both are
   hosted inside myinstall-admin-config.html. ENTIRELY GATED on being framed,
   so opening this file on its own behaves exactly as before — Figma syncs and
   standalone demos are unaffected.

   A question submitted in the wizard arrives here as a real queue row backed by
   a scenario cloned from `bays` (the one authored branch that models a NEW
   question) with the author's actual label, ID, answer type, applicability,
   help text and Step 8 impact numbers written over the top.
   ===================================================================== */
(function(){
  const FRAMED = window.parent !== window;
  if(!FRAMED) return;                                  // standalone = untouched

  const SURFACE='review';
  const post=(type,payload)=>window.parent.postMessage({mi:1,from:SURFACE,type,payload},'*');
  let authored=null;          // the payload we injected, if any
  let aiFlagged=false;
  let overrides={};           // outcome copy rewritten for the authored question

  document.head.appendChild(el(`<style>
    tr[data-mi-new] td{background:#F2F7FE;}
    tr[data-mi-new] .qname::after{content:'Just submitted';margin-left:10px;background:var(--primary-500);color:#fff;
      font-size:10px;font-weight:500;letter-spacing:.4px;text-transform:uppercase;padding:2px 7px;border-radius:9px;vertical-align:2px;}
  </style>`));

  /* Wizard brick owners ("Sarah Chen") → the owner shape this file uses. */
  function ownerObj(name,role){
    const parts=String(name).trim().split(/\s+/);
    const short=parts.length>1 ? parts[0][0]+'. '+parts[parts.length-1] : name;
    return {av:initials(name), n:short, role:role||'Product owner'};
  }

  function inject(p){
    aiFlagged=!!p.aiFlagged;
    const s=JSON.parse(JSON.stringify(SCEN.bays));    // the isNew branch
    /* id stays 'bays' so every id-keyed behaviour in this file keeps working;
       the outcome kind is corrected in the finish() wrapper below. */
    s.q=p.label;
    s.internalId=p.internalId || p.label.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
    s.change='New question'; s.ver='new'; s.isNew=true;
    s.submitted='just now'; s.author=p.author||'S. Gandhi';
    s.sla={txt:'2d 6h left',tone:'ok'};
    s.headline='Authored in the Create Question wizard → carried straight into review';
    /* The diff IS the wizard's own answers — a new question is all additions. */
    s.diff=[
      {f:'Question label',rows:[['+',p.label]]},
      {f:'Answer type',   rows:[['+',p.fieldType+(p.required?' · required to submit':' · optional')]]},
      {f:'Applicability', rows:[['+',p.bricks.join(', ')]]},
    ];
    if(p.helpText) s.diff.push({f:'Help text',rows:[['+',p.helpText]]});
    s.roundFields=s.diff.map(d=>d.f);
    s.impact=p.impact||s.impact;                       // Step 8's numbers, unchanged
    s.rationale='New question authored for '+p.bricks.join(', ')+'. '+(p.aiFlagged
      ? 'The similarity scan surfaced existing bank questions; the author acknowledged the flag and believes this one is scoped differently.'
      : 'The similarity scan returned no close matches, so nothing in the bank covers this ask today.');
    s.deps=['New — no downstream dependencies yet'];
    /* No similarity flag on the author's side means no AI tab here: the review
       is a straight structural read, not a bank-governance decision (RA12). */
    s.ai = p.aiFlagged ? s.ai : null;
    /* Applicability drives the reviewer roster, exactly as Step 3 promised:
       one brick and no flag resolves with a single owner; more bricks — or a
       similarity flag needing a governance call — pulls the brick owners in. */
    const extra=(p.aiFlagged || p.bricks.length>1)
      ? (p.owners||[]).filter((n,i,a)=>a.indexOf(n)===i)   // bricks can share an owner
          .slice(0,2).map(n=>ownerObj(n,p.bricks[0])) : [];
    s.owners=[YOU].concat(extra);
    delete s.delibApprovers;
    SCEN.authored=s;

    /* the queue row (QROWS is const — mutate it in place) */
    for(let i=QROWS.length-1;i>=0;i--) if(QROWS[i].scen==='authored') QROWS.splice(i,1);
    QROWS.unshift({
      q:p.label, by:s.author, change:'New question',
      prod:p.bricks.slice(0,1), plus:p.bricks.length>1?p.bricks.length-1:0,
      sla:s.sla, rev:s.owners.map(o=>[o.n.replace(' (you)',''),'green']),
      scen:'authored', miNew:true,
    });
    authored=p;

    /* The authored ending has to report the author's OWN question — the stock
       endings quote the go-live scenario's version number and impact receipt,
       which reads as a different question entirely once you arrive here from
       the wizard. Only the endings reachable from this branch are rewritten;
       the rest of the gallery is left alone (and restored after render). */
    const im=s.impact, q='“'+p.label+'”';
    overrides={
      approved:'Review resolved — '+q+' approved by all required owners and published as a new question ('
        +s.internalId+'). Publishing scheduled via the publish decision (effective date + scope). Impact receipt: '
        +im.portals+' portals · '+im.inprogress+' in-progress · '+im.templates+' templates · '+im.checklists
        +' checklists. Dealers see it at their next portal load.',
      newdespite:'Approved as a NEW question despite the similarity flag (RA12). Reviewers agreed the existing bank '
        +'question is scoped differently and recorded why the bank should grow here. '+q+' ('+s.internalId
        +') now lives alongside the match, with a note linking the two.',
      rejected:'Review resolved — consensus reject on '+q+'. The consolidated rationale and the full deliberation '
        +'discussion are attached; your question returned to Draft with everything you authored intact. '
        +'Nothing was silently discarded.',
    };
  }

  /* Swap the copy in for the duration of the render, then put it back so the
     notification gallery still shows the authored scenarios' own wording. */
  const _renderOutcome=renderOutcome;
  window.renderOutcome=function(){
    if(cur!=='authored' || !authored) return _renderOutcome.apply(this,arguments);
    const keys=Object.keys(overrides), saved={};
    keys.forEach(k=>{ if(OUTCOME_NOTIF[k]){ saved[k]=OUTCOME_NOTIF[k].msg; OUTCOME_NOTIF[k].msg=overrides[k]; } });
    try { return _renderOutcome.apply(this,arguments); }
    finally { keys.forEach(k=>{ if(OUTCOME_NOTIF[k]) OUTCOME_NOTIF[k].msg=saved[k]; }); }
  };

  /* Queue chrome: real pending count + a marker on the row that just landed. */
  const _renderQueue=renderQueue;
  window.renderQueue=function(){
    _renderQueue.apply(this,arguments);
    const t=$('[data-qtab="mypending"]');
    if(t && queueState!=='empty') t.textContent='My Pending ('+QROWS.length+')';
    if(authored){
      const row=$('tr[data-open="authored"]');
      if(row) row.setAttribute('data-mi-new','1');
    }
  };

  /* Tell the host which seat the viewer is in — the outcome screen is the
     AUTHOR's Question Bank, not the reviewer's queue. */
  const _render=render;
  window.render=function(){
    _render.apply(this,arguments);
    post('role',{role: route==='outcome' ? 'author' : 'reviewer'});
  };

  /* Without a similarity flag there is no "new despite the flag" ending. */
  const _finish=finish;
  window.finish=function(kind){
    if(cur==='authored' && !aiFlagged && kind==='publishedNew') kind='published';
    return _finish.call(this,kind);
  };

  /* ---- crossings back to the authoring surface (capture phase) ---------- */
  document.addEventListener('click',e=>{
    if(!e.target.closest) return;
    const nav=e.target.closest('.nav-item');
    if(nav && nav.textContent.trim()==='Questions'){
      e.stopPropagation(); e.preventDefault();
      post('goto',{surface:'wizard'});
      return;
    }
    if(e.target.closest('#qbNew')){
      e.stopPropagation(); e.preventDefault();
      post('goto',{surface:'wizard',open:'wizard'});
    }
  }, true);

  /* ---- host → review --------------------------------------------------- */
  window.addEventListener('message',e=>{
    const m=e.data; if(!m||m.mi!==1) return;
    if(m.type==='submitted'){
      inject(m.payload);
      route='queue'; cur=null; queueTab='mypending'; queueState='default';
      render();
    }
    if(m.type==='open-authored' && SCEN.authored){
      openScenario('authored');
    }
  });

  post('ready',{surface:SURFACE});
  post('role',{role: route==='outcome' ? 'author' : 'reviewer'});
})();
<\/script>
</body>
</html>

</script>

<script>
/* Inlined-prototype loader (generated by build-admin-config-standalone.py).
   srcdoc rather than blob: URLs — blob: iframes are blocked from a file://
   page, srcdoc is not, and this file's whole point is surviving a double-click. */
Object.keys(FRAMES).forEach(key=>{
  const doc=document.getElementById('doc-'+key);
  if(doc) FRAMES[key].el.srcdoc=doc.textContent.replace(/<\\\/script/gi,'</script');
});
</script>
