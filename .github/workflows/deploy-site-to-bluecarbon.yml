name: Deploy repo to Linode

on:
  # Publish automatically whenever content is pushed to main.
  # Workflow-only changes under .github/ do not trigger a deploy.
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'

  # Manual run, with an optional subdirectory (unchanged).
  workflow_dispatch:
    inputs:
      remote_subdirectory:
        description: Subdirectory inside the base directory
        type: string

concurrency:
  group: deploy-bluecarbon
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

  LINODE_HOST: 69.164.198.131
  LINODE_USER: oscar
  SSH_PORT: "22"
  REMOTE_BASE_DIR: /var/www/bluecarbon.site/html

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LINODE_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan \
            -p "$SSH_PORT" \
            -H "$LINODE_HOST" >> ~/.ssh/known_hosts

      - name: Build remote directory path
        id: remote-path
        env:
          SUBDIRECTORY: ${{ inputs.remote_subdirectory }}
        run: |
          base_dir="${REMOTE_BASE_DIR%/}"
          subdirectory="${SUBDIRECTORY#/}"
          subdirectory="${subdirectory%/}"

          if [ -z "$subdirectory" ]; then
            remote_dir="$base_dir"
          else
            remote_dir="$base_dir/$subdirectory"
          fi

          echo "remote_dir=$remote_dir" >> "$GITHUB_OUTPUT"

      - name: Ensure remote directory exists
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "$SSH_PORT" \
            "$LINODE_USER@$LINODE_HOST" \
            "mkdir -p '${{ steps.remote-path.outputs.remote_dir }}'"

      # On a push, remove from the server exactly the files that the push
      # deleted from the repo. Nothing else on the server is touched.
      - name: Remove files deleted from the repo
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          REMOTE_DIR: ${{ steps.remote-path.outputs.remote_dir }}
        run: |
          if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "Previous commit not available; skipping removal."
            exit 0
          fi

          list="$RUNNER_TEMP/deleted.list"
          git diff --no-renames --name-only --diff-filter=D -z \
            "$BEFORE" "$GITHUB_SHA" -- . ':(exclude).github' > "$list"

          if [ ! -s "$list" ]; then
            echo "No files were deleted in this push."
            exit 0
          fi

          echo "Removing from $REMOTE_DIR:"
          tr '\0' '\n' < "$list"

          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "$SSH_PORT" \
            "$LINODE_USER@$LINODE_HOST" \
            "cd '$REMOTE_DIR' && xargs -0 rm -f --" < "$list"

      - name: Upload repo contents
        run: |
          rsync -avz \
            --exclude='.git' \
            --exclude='.github' \
            -e "ssh -i ~/.ssh/id_ed25519 -p $SSH_PORT" \
            ./ \
            "$LINODE_USER@$LINODE_HOST:${{ steps.remote-path.outputs.remote_dir }}/"