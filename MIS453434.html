<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIS Reporting — End-to-End Prototype</title>
<style>
  :root{
    --ink:#1c2433; --ink-2:#4a5568; --ink-3:#8492a6; --line:#e2e8f0; --line-2:#cbd5e1;
    --bg:#f4f6f9; --card:#ffffff; --brand:#2456d6; --brand-dk:#193f9e; --brand-bg:#eaf0fd;
    --ok:#0f7b5f; --ok-bg:#e3f4ee; --warn:#9a6a00; --warn-bg:#fdf3d7; --bad:#b3261e; --bad-bg:#fbeae9;
    --hi:#0f7b5f; --lo:#b3261e; --memo:#f8fafc; --total:#eef2f9;
    --review:#7c3aed; --review-bg:#f3ecfe;
    --r:10px; --sh:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.05);
    --sh-lg:0 10px 30px rgba(16,24,40,.18);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font:14px/1.45 "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg)}
  button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
  button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
  input,select,textarea{font:inherit;color:var(--ink);border:1px solid var(--line-2);border-radius:6px;padding:7px 10px;background:#fff}
  input:focus,select:focus,textarea:focus{border-color:var(--brand)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* ===== App shell — styled per CDK Global screenshot ===== */
  .topbar{position:fixed;top:0;left:0;right:0;height:60px;background:#000;color:#fff;display:flex;align-items:center;gap:8px;padding:0 22px;z-index:60}
  .cdklogo{font-weight:800;font-size:17px;letter-spacing:.16em;color:#fff;white-space:nowrap}
  .topbar .spacer{flex:1}
  .tico{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;position:relative}
  .tico:hover{background:rgba(255,255,255,.16)}
  .tico svg{width:22px;height:22px;fill:#fff}
  .tico .badge{position:absolute;top:2px;right:2px;background:#e53935;color:#fff;font-size:10px;font-weight:700;border-radius:9px;padding:1px 5px}
  .pill-toggle{display:flex;align-items:center;gap:7px;border:1px solid rgba(255,255,255,.55);border-radius:18px;padding:4px 13px;color:#fff;font-size:12.5px;margin-right:6px}
  .pill-toggle.on{background:#fff;color:#000;font-weight:700;border-color:#fff}
  .avatar{width:38px;height:38px;border-radius:50%;background:#fff;color:#111;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}

  .rail{position:fixed;top:60px;left:0;bottom:0;width:268px;background:#fff;border-right:1px solid #e6e6e6;padding:16px 14px;overflow:auto;z-index:50}
  .ctx{display:flex;align-items:center;gap:11px;width:100%;background:#f1f1f1;border:1px solid #dadada;border-radius:10px;padding:9px 13px;margin-bottom:10px;font-size:14.5px;font-weight:600;color:#111;cursor:pointer;text-align:left;min-height:44px}
  .ctx:hover{background:#e9e9e9}
  .ctx .caret{margin-left:auto;color:#333;font-size:10px}
  .ctx .cico{width:22px;text-align:center;font-size:16px;filter:grayscale(1);line-height:1}
  .drtile{width:26px;height:26px;border-radius:5px;background:#2e7d5b;color:#fff;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
  .rail hr{border:none;border-top:1px solid #e6e6e6;margin:14px 4px}
  .rail h4{font-size:10.5px;letter-spacing:.09em;color:#8a8a8a;text-transform:uppercase;margin:16px 12px 6px}
  .rail a{display:flex;align-items:center;gap:12px;padding:10px 13px;border-radius:9px;color:#111;text-decoration:none;font-size:14px;min-height:42px}
  .rail a:hover{background:#f1f1f1}
  .rail a.active{background:#c9c9c9;color:#000;font-weight:600}
  .rail a .ic{width:20px;text-align:center;filter:grayscale(1);font-size:15px}

  main{margin:60px 0 0 268px;padding:20px 24px 80px;max-width:1280px}
  .crumbs{font-size:12.5px;color:var(--ink-3);margin-bottom:10px}
  .crumbs b{color:var(--ink-2);font-weight:600}
  .pagehead{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:14px}
  .pagehead h1{font-size:21px;font-weight:650}
  .pagehead .sub{color:var(--ink-3);font-size:13px;margin-top:2px}
  .pagehead .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

  /* ===== Cards / layout ===== */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
  .card .hd{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:600;font-size:14.5px}
  .card .hd .rt{margin-left:auto;font-weight:400;font-size:12.5px}
  .card .bd{padding:14px 16px}
  .grid{display:grid;gap:16px}
  .cols-3{grid-template-columns:1.2fr 1.2fr .8fr}
  .cols-2{grid-template-columns:1fr 1fr}
  @media(max-width:1050px){.cols-3,.cols-2{grid-template-columns:1fr}}
  .mt{margin-top:16px}

  /* ===== Buttons / chips ===== */
  .btn{display:inline-flex;align-items:center;gap:7px;border-radius:8px;padding:8px 14px;font-weight:600;font-size:13.5px;border:1px solid transparent;min-height:36px}
  .btn.pri{background:var(--brand);color:#fff}
  .btn.pri:hover{background:var(--brand-dk)}
  .btn.sec{background:#fff;border-color:var(--line-2);color:var(--ink-2)}
  .btn.sec:hover{border-color:var(--brand);color:var(--brand-dk)}
  .btn.ghost{color:var(--brand-dk)}
  .btn.ghost:hover{background:var(--brand-bg)}
  .btn.danger{background:#fff;border-color:#eab7b3;color:var(--bad)}
  .btn.sm{padding:5px 10px;min-height:30px;font-size:12.5px}
  .link{color:var(--brand-dk);text-decoration:none;font-weight:600;cursor:pointer}
  .link:hover{text-decoration:underline}
  .chip{display:inline-flex;align-items:center;gap:5px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:3px 10px;font-size:12px;color:var(--ink-2)}
  .chip.blue{background:var(--brand-bg);border-color:#c4d4f5;color:var(--brand-dk)}
  .chip.ok{background:var(--ok-bg);border-color:#bfe3d6;color:var(--ok)}
  .chip.warn{background:var(--warn-bg);border-color:#ecd9a0;color:var(--warn)}
  .chip.bad{background:var(--bad-bg);border-color:#efc4c1;color:var(--bad)}
  .tag{display:inline-block;font-size:10.5px;font-weight:700;border-radius:4px;padding:1px 6px;letter-spacing:.03em}
  .tag.D{background:var(--brand-bg);color:var(--brand-dk)} .tag.T{background:#e8e2f7;color:#5b3fa8}
  .tag.C{background:var(--ok-bg);color:var(--ok)} .tag.M{background:#eef1f5;color:var(--ink-3)}

  /* ===== Tables ===== */
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:600;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);background:#fafbfd;white-space:nowrap}
  td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  th.num{text-align:right}
  .rowlink{cursor:pointer}
  .rowlink:hover td{background:#f6f9ff}
  .neg{color:var(--bad)}
  .band th{background:var(--brand-bg);color:var(--brand-dk);text-align:center;border-right:1px solid #d7e2f8}
  tr.memo td{background:var(--memo);font-weight:700;letter-spacing:.04em;color:var(--ink-2)}
  tr.total td{background:var(--total);font-weight:650}
  tr.exc td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
  .hilo{font-weight:700;font-size:11px}
  .hilo.H{color:var(--hi)} .hilo.L{color:var(--lo)}

  /* ===== Toolbar / filterbar ===== */
  .fbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;box-shadow:var(--sh)}
  .fbar .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:700;margin-right:2px}
  .seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
  .seg button{padding:6px 12px;font-size:12.5px;color:var(--ink-2);border-right:1px solid var(--line-2);min-height:32px}
  .seg button:last-child{border-right:none}
  .seg button.on{background:var(--brand);color:#fff;font-weight:600}
  .switch{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2);cursor:pointer}
  .switch .tr{width:34px;height:19px;border-radius:10px;background:var(--line-2);position:relative;transition:background .15s}
  .switch .tr::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:left .15s}
  .switch.on .tr{background:var(--brand)}
  .switch.on .tr::after{left:17px}

  /* ===== Report render ===== */
  .rpthead{text-align:center;padding:16px 10px 12px;border-bottom:1px solid var(--line)}
  .rpthead .t1{font-weight:700;font-size:15px;letter-spacing:.05em}
  .rpthead .t2{font-size:12.5px;color:var(--ink-2);margin-top:2px;letter-spacing:.04em}
  .excbanner{background:var(--bad-bg);color:var(--bad);font-weight:700;text-align:center;padding:7px;letter-spacing:.12em;font-size:12px;border-bottom:1px solid #efc4c1}

  /* ===== Drawers ===== */
  .scrim{position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:80;animation:fade .18s}
  @keyframes fade{from{opacity:0}}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:560px;max-width:94vw;background:#fff;z-index:90;box-shadow:var(--sh-lg);display:flex;flex-direction:column;animation:slidein .22s ease-out}
  .drawer.wide{width:760px}
  @keyframes slidein{from{transform:translateX(40px);opacity:.4}}
  .drawer .dh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
  .drawer .dh h3{font-size:15.5px}
  .drawer .dh .x{margin-left:auto;width:34px;height:34px;border-radius:8px;font-size:16px;color:var(--ink-3)}
  .drawer .dh .x:hover{background:var(--bg)}
  .drawer .db{padding:16px 18px;overflow:auto;flex:1}
  .drawer .df{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
  .lvl{font-size:10.5px;font-weight:700;color:var(--brand-dk);background:var(--brand-bg);border-radius:4px;padding:2px 7px;letter-spacing:.05em}

  /* ===== Modal ===== */
  .modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
  .modal .mbox{background:#fff;border-radius:12px;box-shadow:var(--sh-lg);width:560px;max-width:96vw;max-height:92vh;display:flex;flex-direction:column;animation:pop .18s ease-out}
  @keyframes pop{from{transform:scale(.97);opacity:.5}}
  .mbox .mh{padding:15px 20px;border-bottom:1px solid var(--line);font-weight:650;font-size:15.5px;display:flex;align-items:center}
  .mbox .mh .x{margin-left:auto;color:var(--ink-3);width:30px;height:30px;border-radius:6px}
  .mbox .mb{padding:16px 20px;overflow:auto}
  .mbox .mf{padding:13px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:4px}
  .field .hint{font-size:11.5px;color:var(--ink-3);margin-top:3px}
  .field input[type=text],.field input[type=email],.field input[type=date],.field select,.field textarea{width:100%}
  .frow{display:flex;gap:12px}.frow .field{flex:1}

  /* ===== Review annotations ===== */
  .annobar{display:none;background:var(--review-bg);border:1px dashed var(--review);border-radius:var(--r);padding:10px 14px;margin-bottom:14px;font-size:12.5px;color:#4b2d87}
  body.review .annobar{display:block}
  .annobar b{color:var(--review)}
  .annobar .chip{background:#fff;border-color:#d8c6f7;color:#5b3fa8;margin:2px 3px 0 0}
  .gfnote{display:none;font-size:11.5px;color:var(--review);background:var(--review-bg);border-radius:5px;padding:2px 7px;font-weight:600}
  body.review .gfnote{display:inline-block}

  /* ===== Toast ===== */
  #toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center}
  .toast{background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:13.5px;box-shadow:var(--sh-lg);animation:pop .2s ease-out;display:flex;gap:10px;align-items:center;max-width:640px}
  .toast.ok{background:var(--ok)}
  .toast.warn{background:#7a5600}

  /* ===== Misc ===== */
  .kv{display:grid;grid-template-columns:170px 1fr;row-gap:8px;column-gap:12px;font-size:13px}
  .kv dt{color:var(--ink-3)}
  .kv dd{font-weight:500}
  .statline{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
  .statline b{display:block;font-size:15px;color:var(--ink)}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px}
  .dot.g{background:var(--ok)} .dot.y{background:#d9a400} .dot.r{background:var(--bad)}
  .empty{padding:34px;text-align:center;color:var(--ink-3)}
  .empty b{display:block;color:var(--ink-2);font-size:15px;margin-bottom:5px}
  .tabs{display:flex;gap:2px;border-bottom:2px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
  .tabs button{padding:9px 16px;font-size:13.5px;font-weight:600;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-2px;min-height:40px}
  .tabs button.on{color:var(--brand-dk);border-bottom-color:var(--brand)}
  .tabs button:hover{color:var(--ink)}
  .stepper{display:flex;gap:0;flex-wrap:wrap;margin-bottom:16px}
  .stepper .st{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-3);padding:5px 14px 5px 8px;position:relative}
  .stepper .st .n{width:22px;height:22px;border-radius:50%;background:var(--line);color:var(--ink-2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px}
  .stepper .st.done .n{background:var(--ok);color:#fff}
  .stepper .st.cur{color:var(--brand-dk);font-weight:700}
  .stepper .st.cur .n{background:var(--brand);color:#fff}
  .arrow{color:var(--line-2);align-self:center}
  .printdoc{font-family:"Courier New",monospace;font-size:12px;background:#fff;border:1px solid var(--line);padding:22px 26px;white-space:pre-wrap;line-height:1.5;border-radius:6px;overflow:auto}
  .searchbox{position:relative}
  .searchbox input{padding-left:30px;width:230px}
  .searchbox::before{content:"⌕";position:absolute;left:9px;top:6px;color:var(--ink-3);font-size:16px}

  /* ===== Benchmarking (Module BMK) — styled per 07-21 benchmark screenshots ===== */
  .bmkwrap{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:16px}
  .bmkrow1{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #eceff3;flex-wrap:wrap}
  .bmkrow2{display:flex;align-items:center;gap:14px;padding:12px 14px;flex-wrap:wrap}
  .perpill{display:inline-flex;align-items:center;gap:8px;background:#e8f0fe;color:#1a63d6;font-weight:600;border-radius:20px;padding:8px 16px;font-size:14px;cursor:pointer;border:none}
  .selpill{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid #d7dbe0;border-radius:20px;padding:8px 16px;font-size:14px;color:#222;cursor:pointer;position:relative}
  .selpill .caret,.perpill .caret,.bsel .caret{font-size:10px}
  .bmktoggle{display:inline-flex;align-items:center;gap:10px;font-size:14.5px;color:#222;cursor:pointer;border:none;background:none}
  .btrack{width:44px;height:24px;border-radius:12px;background:#b9bec6;position:relative;transition:background .15s;flex:none}
  .btrack::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:left .15s}
  .bmktoggle.on .btrack{background:#4285f4}
  .bmktoggle.on .btrack::after{left:22px}
  .bmklabel{font-size:15px;color:#222}
  .bsel{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #c9cdd2;border-radius:10px;padding:10px 14px;font-size:14.5px;cursor:pointer;min-width:320px;position:relative;text-align:left}
  .bsel.hot{border:2px solid #4285f4;box-shadow:0 0 0 3px #d2e3fc;border-radius:12px;padding:9px 13px}
  .bsel .caret{margin-left:auto;color:#4285f4}
  .bglyph{font-size:15px;line-height:1}
  .bmenu{position:absolute;top:calc(100% + 6px);left:0;min-width:100%;background:#fff;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.22);z-index:70;overflow:hidden;padding:4px 0}
  .bmenu button{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;font-size:14.5px;text-align:left;white-space:nowrap}
  .bmenu button:hover{background:#eef1f5}
  .bmenu button.sel{background:#e8f0fe}
  .bmenu button .ck{margin-left:auto;color:#4285f4;font-weight:700}
  .sharebtn{display:inline-flex;align-items:center;gap:8px;background:#e8f0fe;color:#1a63d6;font-weight:600;border-radius:10px;padding:9px 18px;font-size:14.5px}
  .sharebtn:hover{background:#d9e7fd}
  .bt th.mtdhdr{background:#9e9e9e;color:#fff;text-transform:none;font-size:12.5px;text-align:right}
  .bt td.gsep,.bt th.gsep{border-left:2px solid #dfe3e8}
  .bpill{display:inline-flex;align-items:center;gap:6px;border-radius:15px;padding:3px 12px;font-weight:700;font-size:12.5px;white-space:nowrap}
  .bpill .bico{width:16px;height:16px;border-radius:50%;border:1.6px solid currentColor;display:inline-flex;align-items:center;justify-content:center;font-size:9.5px;line-height:1;flex:none}
  .bpill.gf{background:#78953c;color:#fff}
  .bpill.go{border:1.6px solid #78953c;color:#5c7527;background:#fff}
  .bpill.rf{background:#b0453e;color:#fff}
  .bpill.ro{border:1.6px solid #b0453e;color:#a03d37;background:#fff}
  .bpill.n{border:1.6px solid #d2913c;color:#b57727;background:#fff}
  .goalnote{font-size:11px;color:var(--ink-3);margin-top:2px}
</style>
</head>
<body>

<header class="topbar">
  <div class="cdklogo">CDK GLOBAL</div>
  <div class="spacer"></div>
  <button class="pill-toggle" id="reviewToggle" aria-pressed="false" title="Show requirement IDs, gap-fills and open questions on every screen">
    <span>◉</span> Review notes <b id="revState">OFF</b>
  </button>
  <button class="tico" aria-label="Apps" onclick="toast('App switcher (chrome only in prototype)')">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h4v4H4zM10 4h4v4h-4zM16 4h4v4h-4zM4 10h4v4H4zM10 10h4v4h-4zM16 10h4v4h-4zM4 16h4v4H4zM10 16h4v4h-4zM16 16h4v4h-4z"/></svg></button>
  <button class="tico" aria-label="Help" onclick="toast('Help (chrome only in prototype)')">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16zm-.1-12.9c-1.7 0-3 .9-3.6 2.3l1.8.8c.3-.7.9-1.3 1.8-1.3.9 0 1.5.5 1.5 1.2 0 1.3-1.9 1.4-2.4 3h2c.3-1 2.4-1.4 2.4-3.2 0-1.7-1.4-2.8-3.5-2.8zM11 15.5h2v2h-2z"/></svg></button>
  <button class="tico" aria-label="Notifications, 2 unread" onclick="toast('2 notifications: schedule delivered · 2 unmapped accounts')">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22a2.3 2.3 0 0 0 2.3-2.3H9.7A2.3 2.3 0 0 0 12 22zm7-5.3v-1l-1.5-1.5V9.9c0-3-1.6-5.5-4.4-6.2v-.6a1.1 1.1 0 1 0-2.2 0v.6C8.1 4.4 6.5 6.9 6.5 9.9v4.3L5 15.7v1z"/></svg><span class="badge">2</span></button>
  <div class="avatar" title="Gina Jordan — Controller">GJ</div>
</header>

function lineVals(l){
  if(l.t==='D'){ const s=l.sign||1; return {day:l.day*s,mtd:l.mtd*s,ytd:l.ytd*s,pMtd:l.pMtd*s,pYtd:l.pYtd*s,uMtd:l.uMtd,uDay:l.uDay,uYtd:l.uYtd}; }

    l.refs.forEach(r=>{const v=lineVals(LINES.find(x=>x.id===r)); for(const k in acc)acc[k]+=v[k]||0;}); return acc; }
  if(l.t==='C'){
    if(l.id===710){const v=lineVals(LINES.find(x=>x.id===100)); return {day:v.uDay?Math.round(v.day/v.uDay):0, mtd:v.uMtd?Math.round(v.mtd/v.uMtd):0, ytd:v.uYtd?Math.round(v.ytd/v.uYtd):0, pMtd:null,pYtd:null,isCalc:1};}

  }
  return {};
}
/* Exception test: MTD actual unfavorable vs plan (placeholder logic — OQ-11/OQ-5: legacy threshold undefined) */
function excState(l){
  if(l.t==='M'||l.t==='C') return '';
  const v=lineVals(l); if(v.pMtd==null||v.pMtd===0) return '';
  const isExpense = l.sign===-1;
  const unfav = isExpense ? Math.abs(v.mtd)>Math.abs(v.pMtd) : v.mtd<v.pMtd;
  return unfav ? 'L' : 'H';
}

};
const BDAYS_DONE=18, BDAYS_MON=26;
function benchVals(l,key){
 if(l.t==='D'){ const s=l.sign||1;
   if(key==='goal') return l.pMtd!=null? l.pMtd*s : null;
   return l[key]!=null? l[key]*s : null; }
 if(l.t==='T'){ let sum=0,ok=false; l.refs.forEach(r=>{const v=benchVals(LINES.find(x=>x.id===r),key); if(v!=null){sum+=v;ok=true}}); return ok?sum:null; }
 if(l.id===720){ const a=benchVals(LINES.find(x=>x.id===500),key), b=benchVals(LINES.find(x=>x.id===200),key);
   return (a!=null&&b)? Math.round(a/b*1000)/10 : null; }
 return null;
}
function projOf(l){ const v=lineVals(l); if(l.id===720) return v.mtd; /* ratio projects to itself under linear proration */
 return Math.round(v.mtd/BDAYS_DONE*BDAYS_MON); } /* GF-15: straight-line business-day proration */
function bmkPill(l,proj,bench){
 if(bench==null||bench===0) return '';
 const isPct = l.id===720;
 const pct = isPct ? (proj-bench) : (proj-bench)/Math.abs(bench)*100;  /* sign already applied ⇒ higher = favorable (GF-18) */
 const a=Math.abs(pct), fav=pct>0;
 const neutral = isPct ? a<2 : a<10, strong = isPct ? a>=5 : a>=20;
 const cls = neutral ? 'n' : fav ? (strong?'gf':'go') : (strong?'rf':'ro');
 const ico = fav ? (strong&&!neutral?'★':'↑') : '↓';
 const plain=v=>(v<0?'(':'')+Math.abs(Math.round(v)).toLocaleString()+(v<0?')':'');
 return `<span class="bpill ${cls}" title="Projection ${isPct?proj.toFixed(1)+'pp':plain(proj)} vs benchmark ${isPct?bench.toFixed(1)+'pp':plain(bench)} — bands per GF-17, direction-aware per GF-18"><span class="bico">${ico}</span>${a.toFixed(1)}${isPct?' pp':'%'}</span>`;
}
function bmkBar(compact){
 const slot = (n)=>{ const cur=BOPT[S.bmk['b'+n]];
  return `<div class="bsel ${n===1?'hot':''}" role="button" tabindex="0" onclick="event.stopPropagation();S.bmk.menu=S.bmk.menu===${n}?0:${n};render()" onkeydown="if(event.key==='Enter'){this.click()}" aria-haspopup="listbox" aria-expanded="${S.bmk.menu===n}">
    <span class="bglyph">${cur.g}</span> ${esc(cur.label)} <span class="caret">▼</span>
    ${S.bmk.menu===n?`<div class="bmenu" role="listbox">${Object.keys(BOPT).map(k=>`
      <button role="option" class="${S.bmk['b'+n]===k?'sel':''}" onclick="event.stopPropagation();S.bmk['b'+${n}]='${k}';S.bmk.menu=0;render();${k==='goals'?`toast('Goals & Budgets reads the forecast/plan store (GF-16 — decision OQ-30)')`:''}">
        <span class="bglyph">${BOPT[k].g}</span> ${esc(BOPT[k].label)} ${S.bmk['b'+n]===k?'<span class="ck">✓</span>':''}</button>`).join('')}</div>`:''}
  </div>`; };
 return `<div class="bmkwrap" onclick="if(S.bmk.menu){S.bmk.menu=0;render()}">
  <div class="bmkrow1">
   <button class="perpill" onclick="toast('Period list per BMK-02: MTD · full YTD · 13-month trend · previous quarter · five-quarter trend · any prior-month YTD · previous year — trends need the closed-month engine (OQ-23/OQ-28)')">📅 July 2026 (Month-to-Date) <span class="caret">▼</span></button>
   <div class="selpill" role="button" tabindex="0" onclick="event.stopPropagation();S.bmk.menu=S.bmk.menu===3?0:3;render()" onkeydown="if(event.key==='Enter'){this.click()}">Business Segment <span class="caret">▼</span>
    ${S.bmk.menu===3?`<div class="bmenu">${[['all','All segments'],['var','Variable Ops (vehicle)'],['fix','Fixed Ops (service/parts)']].map(s=>`
      <button class="${S.bmk.seg===s[0]?'sel':''}" onclick="event.stopPropagation();S.bmk.seg='${s[0]}';S.bmk.menu=0;render();toast('Segment mapping to MIS departments is OQ-32')">${s[1]} ${S.bmk.seg===s[0]?'<span class="ck">✓</span>':''}</button>`).join('')}</div>`:''}
   </div>
   <button class="selpill" onclick="toast('Store → GL company (BMK-15). Fixture: 123 - Chevy Northwest')">Store <span class="caret">▼</span></button>
   <button class="bmktoggle ${S.bmk.compareAll?'on':''}" onclick="S.bmk.compareAll=!S.bmk.compareAll;render();toast('Compare All Stores → cross-company comparison (relates to consolidation ENG-05 · OQ-32)')"><span class="btrack"></span> Compare All Stores</button>
   <span style="margin-left:auto;display:flex;gap:6px;align-items:center">
     ${compact?'<span class="chip blue" title="Selections persist as you move between reports (BMK-14)">persists across reports · BMK-14</span>':''}
     <button class="btn sm ghost" title="Search" onclick="toast('Search (prototype)')">⌕</button>
     ${compact?'':'<button class="btn sm ghost" onclick="S.bmk.on=false;render()" title="Return to the standard format view">✕ Exit benchmarks</button>'}
   </span>
  </div>
  <div class="bmkrow2">
   <button class="bmktoggle ${S.bmk.proj?'on':''}" onclick="S.bmk.proj=!S.bmk.proj;render()"><span class="btrack"></span> Projections</button>
   <span class="bmklabel">Benchmarks</span>
   ${slot(1)} ${slot(2)}
   <span class="gfnote">GF-15 projection math · GF-17 bands · OQ-30…33</span>
  </div>
 </div>`;
}
function bmkViewer(){
 const segIds = S.bmk.seg==='var' ? [100,110,120,200] : S.bmk.seg==='fix' ? [250,300,310,320,400] : null;
 const rows = LINES.filter(l=>l.id!==710 && (!segIds || segIds.includes(l.id)));
 const benches = [S.bmk.b1,S.bmk.b2].filter(k=>k!=='none').map(k=>BOPT[k]);
 const th = `<tr>
   <th style="width:26%">Metric</th><th style="width:26px"></th>
   <th class="num mtdhdr">Month-to-Date</th>
   ${S.bmk.proj?'<th class="num">Month-End Projection</th>':''}
   ${benches.map(b=>`<th class="gsep" style="width:26px;text-align:center;font-size:14px">${b.g}</th><th class="num">${b.col}</th><th style="color:#9aa3ad">${b.vs}</th>`).join('')}</tr>`;
 const tr = rows.map(l=>{
   if(l.t==='M') return `<tr class="memo"><td colspan="${3+(S.bmk.proj?1:0)+benches.length*3}">${esc(l.d)}</td></tr>`;
   const v=lineVals(l), proj=projOf(l), isPct=l.id===720;
   const cells = benches.map(b=>{ const bv=benchVals(l,b.key);
     let cell = bv==null?'—':(isPct? bv.toFixed(1)+'%' : '$&nbsp;'+money(bv));
     if(b.key==='goal'&&bv!=null&&!isPct&&bv!==0) cell += `<div class="goalnote">MTD = ${Math.round(v.mtd/bv*100)}% of goal</div>`; /* BMK-12 */
     return `<td class="num gsep">${cell}</td><td>${bv==null?'':bmkPill(l,proj,bv)}</td>`; }).join('');
   return `<tr class="${l.t==='T'?'total':''} rowlink" onclick="lineDrill(${l.id})">
     <td><span style="color:var(--ink-3);font-size:11px;margin-right:7px">${l.id}</span>${esc(l.d)}</td>
     <td style="color:#4285f4;font-weight:700">›</td>
     <td class="num">${isPct? v.mtd.toFixed(1)+'%' : '$&nbsp;'+money(v.mtd)}</td>
     ${S.bmk.proj?`<td class="num" title="GF-15: MTD ÷ ${BDAYS_DONE} × ${BDAYS_MON} business days (work-schedule aware)">↗&nbsp;${isPct? proj.toFixed(1)+'%' : '$&nbsp;'+money(proj)}</td>`:''}
     ${cells}</tr>`; }).join('');
 return `
 ${anno('viewer')}
 ${crumbs('Accounting Reports','M.I.S.','Daily Operating Control','Benchmarks')}
 <div class="pagehead"><div><h1>Daily Operating Control</h1>
   <div class="sub">M.I.S. · ${COMPANIES.find(c=>c.id===S.company).n} · Benchmark view (Module BMK) · Data as of ${S.freshCalc}</div></div>
  <div class="actions">
   <button class="btn sec" onclick="savedViewsDlg()">☆ Views</button>
   <button class="sharebtn" onclick="shareMenu()"><svg width="17" height="17" viewBox="0 0 24 24" fill="#1a63d6" aria-hidden="true"><path d="M14 5v3.5C7.6 9.4 4.9 14 4 19c2.4-3.5 5.6-5.4 10-5.4V17l7-6z"/></svg> Share</button>
  </div></div>
 ${bmkBar(false)}
 <div class="card">
  <div class="hd">${S.bmk.seg==='fix'?'Fixed Operations':S.bmk.seg==='var'?'Variable Operations':'Gross Profit — all segments'}
    <span class="rt" style="color:var(--ink-3)">benchmark values are illustrative fixtures</span></div>
  <table class="bt"><thead>${th}</thead><tbody>${tr}</tbody></table>
  <div style="padding:9px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3)">
   ★ / ↑ favorable vs benchmark · ↓ unfavorable · filled pill = beyond ±20% (GF-17 defaults, dealer-configurable — OQ-31) · direction-aware for expense lines (GF-18) ·
   Projection = business-day proration (GF-15 — OQ-33) · Rows stay drillable (BMK-13) · Goals &amp; Budgets reads the forecast store (GF-16 — OQ-30)</div>
 </div>`;
}
function shareMenu(){ modal(`<div class="mh">Share this report<button class="x" onclick="closeOvNow()">✕</button></div>
 <div class="mb"><p class="hint">Share maps to the existing distribution module (BMK-16 → DST). The benchmarked view exports and delivers like any saved view state.</p>
  <div style="display:flex;flex-direction:column;gap:8px" class="mt">
   <button class="btn sec" onclick="emailDlg()">✉ Email this report…</button>
   <button class="btn sec" onclick="scheduleDlg('M.I.S. — Daily Operating Control')">🗓 Schedule delivery…</button>
   <button class="btn sec" onclick="exportDlg()">⤓ Export PDF / Excel…</button></div></div>
 <div class="mf"><button class="btn sec" onclick="closeOvNow()">Close</button></div>`); }
</script>
